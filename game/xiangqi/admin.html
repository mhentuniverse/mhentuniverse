<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đài Chỉ Huy - Cờ Tướng | MHEnt. Game</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ef4444">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/game/game-theme.css"> 
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --hub-color: #ef4444; --hub-bg: rgba(239, 68, 68, 0.1); }
        body { font-family: 'Nunito', sans-serif !important; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .admin-layout { display: flex; min-height: 100vh; padding-top: 70px; }
        .admin-sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; padding: 30px 20px; position: fixed; height: calc(100vh - 70px); overflow-y: auto; z-index: 10; box-sizing: border-box; }
        .admin-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 10px; color: #cbd5e1; font-weight: 800; cursor: pointer; transition: 0.3s; margin-bottom: 5px; text-decoration: none; }
        .admin-menu-item:hover { background: #334155; color: #f8fafc; }
        .admin-menu-item.active { background: rgba(239, 68, 68, 0.18); color: #f8fafc; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.22); }
        .admin-content { flex: 1; margin-left: 260px; padding: 40px; box-sizing: border-box; overflow-x: hidden; }
        .admin-title { font-size: 28px; font-weight: 900; color: #f8fafc; margin: 0 0 30px 0; }
        .admin-tab { display: none; } .admin-tab.active { display: block; }
        .admin-card { background: #1e293b; border-radius: 20px; padding: 30px; border: 1px solid #334155; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 20px; } .input-group.full { grid-column: 1 / -1; }
        .input-group label { display: block; font-weight: 800; color: #cbd5e1; margin-bottom: 8px; font-size: 14px; }
        .admin-input, .admin-select { width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #cbd5e1; font-size: 15px; font-weight: 600; outline: none; box-sizing: border-box; }
        .admin-input:focus, .admin-select:focus { background: #1e293b; color: white; border-color: var(--hub-color); }
        .btn-admin { border: none; padding: 12px 25px; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; color: white; }
        .btn-primary { background: #3b82f6; } .btn-success { background: #10b981; } .btn-warning { background: #f59e0b; } .btn-danger { background: #ef4444; width: auto !important}
        .room-item { background: #1e293b; border-radius: 16px; padding: 25px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; margin-bottom: 15px; }
        .player-slot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: #0f172a; border-radius: 10px; flex: 1; border: 1px solid #334155; color: #cbd5e1; font-weight: 600; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; background: #334155; color: #cbd5e1; }
        @media (max-width: 992px) { .admin-layout { flex-direction: column; } .admin-sidebar { width: 100%; height: auto; position: relative; display: flex; overflow-x: auto; padding: 15px; border-bottom: 1px solid #334155; } .admin-content { margin-left: 0; padding: 20px; } .room-item { flex-direction: column; align-items: flex-start; gap: 15px; } .room-item > div:last-child { width: 100%; display: flex; gap: 8px; flex-wrap: wrap;} }
    </style>
</head>
<body>
    <nav class="navbar" style="position: fixed; width: 100%; z-index: 1000; box-sizing: border-box; background: #0f172a; border-bottom: 1px solid #334155; padding: 10px 20px; display: flex; justify-content: space-between;">
        <div class="nav-left">
            <a href="/game/xiangqi" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-weight: 900;">
                <img src="/assets/avt-web.jpg" style="width: 30px; height: 30px; border-radius: 50%;"> MHEnt. Xiangqi Admin
            </a>
        </div>
    </nav>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a class="admin-menu-item active" id="menu-dash" onclick="switchTab('dash')"><i class="fa-solid fa-satellite-dish"></i> Đài Chỉ Huy</a>
            <a class="admin-menu-item" id="menu-create" onclick="switchTab('create')"><i class="fa-solid fa-plus-circle"></i> Tạo Phòng Đặc Biệt</a>
            <a class="admin-menu-item" id="menu-manage" onclick="switchTab('manage')"><i class="fa-solid fa-users-cog"></i> Quản Lý VĐV</a>
            <a class="admin-menu-item" id="menu-bulk" onclick="switchTab('bulk')"><i class="fa-solid fa-lock-open"></i> Mở Khóa Đấu Trường</a>
        </aside>

        <main class="admin-content">
            <div id="tab-dash" class="admin-tab active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
                    <h1 class="admin-title">Xiangqi Control Panel</h1>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-admin btn-primary" onclick="switchTab('create')"><i class="fa-solid fa-hammer"></i> TẠO BÀN</button>
                        <button class="btn-admin btn-success" onclick="window.bulkUnlockRooms()"><i class="fa-solid fa-unlock"></i> MỞ TẤT CẢ</button>
                    </div>
                </div>
                <div id="room-list-container"><p style="text-align: center; color: #94a3b8;">Đang kết nối dữ liệu...</p></div>
            </div>

            <div id="tab-create" class="admin-tab">
                <h1 class="admin-title">Tạo Phòng Đặc Biệt</h1>
                <div class="admin-card">
                    <div class="form-grid">
                        <div class="input-group"><label>Mã Phòng (ID)</label><input type="text" id="special-room-id" class="admin-input" placeholder="Ví dụ: CHUNGKET..."></div>
                        <div class="input-group">
                            <label>Số Ván Thắng Cần (Target Wins)</label>
                            <select id="special-target-wins" class="admin-select"><option value="2">Bo3 (Thường)</option><option value="3">Bo5 (Dài)</option><option value="1">Bo1 (Nhanh)</option></select>
                        </div>
                        <div class="input-group">
                            <label>Trạng Thái Ban Đầu</label>
                            <select id="special-status" class="admin-select"><option value="waiting">Chờ VĐV Vào</option><option value="locked">Khóa (BTC Chuẩn Bị)</option></select>
                        </div>
                        <div class="input-group"><label><i class="fa-solid fa-stopwatch"></i> Thời gian mỗi bên (Phút)</label><input type="number" id="special-time" class="admin-input" value="10"></div>
                        <div class="input-group"><label><i class="fa-solid fa-plus-minus"></i> Bước bù giờ (Giây)</label><input type="number" id="special-inc" class="admin-input" value="5"></div>
                        <div class="input-group"><label><i class="fa-solid fa-pause"></i> Số lần Dừng trận</label><input type="number" id="special-break-count" class="admin-input" value="1"></div>
                        <div class="input-group"><label><i class="fa-solid fa-hourglass-half"></i> Thời gian Dừng (s)</label><input type="number" id="special-break-time" class="admin-input" value="60"></div>
                        <div class="input-group full"><label>Ghi Chú</label><input type="text" id="special-note" class="admin-input" placeholder="Ghi chú giải đấu..."></div>
                    </div>
                    <div style="margin-top: 20px; text-align: center;"><button class="btn-admin btn-primary" onclick="window.createSpecialRoom()"><i class="fa-solid fa-plus-circle"></i> TẠO PHÒNG</button></div>
                </div>
            </div>

            <div id="tab-manage" class="admin-tab">
                <h1 class="admin-title">Quản Lý Vận Động Viên</h1>
                <div class="admin-card">
                    <div class="form-grid">
                        <div class="input-group"><label>Mã Phòng</label><input type="text" id="manage-room-id" class="admin-input" placeholder="Nhập mã phòng"></div>
                        <div class="input-group"><label>Hoặc Chọn Phòng</label><select id="manage-room-select" class="admin-select" onchange="window.loadRoomForManagement()"><option value="">-- Chọn --</option></select></div>
                    </div>
                    <div id="room-management-panel" style="display: none; margin-top: 30px;">
                        <h3 style="color: #ef4444; margin-bottom: 20px;">Quản Lý Bàn: <span id="current-room-id"></span></h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                            <div class="player-slot" style="background: rgba(239, 68, 68, 0.05);">
                                <div><b style="color: #ef4444; background: rgba(239,68,68,0.1); padding: 4px 8px; border-radius: 5px;">ĐỎ</b> <span id="red-player-name" style="margin-left: 10px;">Chờ VĐV...</span></div>
                                <button class="btn-admin btn-danger" onclick="window.clearPlayer('host')"><i class="fa-solid fa-times"></i></button>
                            </div>
                            <div class="player-slot" style="background: rgba(0, 0, 0, 0.2);">
                                <div><b style="color: #94a3b8; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 5px;">ĐEN</b> <span id="black-player-name" style="margin-left: 10px;">Chờ VĐV...</span></div>
                                <button class="btn-admin btn-warning" onclick="window.clearPlayer('guest')"><i class="fa-solid fa-times"></i></button>
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <button class="btn-admin btn-primary" onclick="window.swapPlayersManagement()"><i class="fa-solid fa-arrows-rotate"></i> TRÁO MÀU</button>
                            <button class="btn-admin btn-success" onclick="window.startMatch()"><i class="fa-solid fa-play"></i> BẮT ĐẦU</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-bulk" class="admin-tab">
                <h1 class="admin-title">Mở Khóa Đấu Trường</h1>
                <div class="admin-card">
                    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                        <button class="btn-admin btn-success" onclick="window.selectAllRooms()"><i class="fa-solid fa-check-square"></i> CHỌN TẤT CẢ</button>
                        <button class="btn-admin btn-warning" onclick="window.deselectAllRooms()"><i class="fa-solid fa-square"></i> BỎ CHỌN TẤT CẢ</button>
                        <button class="btn-admin btn-primary" onclick="window.bulkLockSelected()"><i class="fa-solid fa-lock"></i> KHÓA LẠI</button>
                        <button class="btn-admin btn-success" onclick="window.bulkUnlockSelected()"><i class="fa-solid fa-unlock"></i> KHAI CUỘC</button>
                    </div>
                    <div id="bulk-room-list" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const SB_URL = "https://ctzkgchjheirxwejctvl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0";
        const supabase = createClient(SB_URL, SB_KEY);

        const firebaseConfig = { apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse", storageBucket: "mhentuniverse.firebasestorage.app", messagingSenderId: "377044322952", appId: "1:377044322952:web:d657d1b0806d37d9246d3d" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let roomsData = [];

        window.switchTab = function(tabName) { 
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active')); 
            document.querySelectorAll('.admin-menu-item').forEach(m => m.classList.remove('active')); 
            document.getElementById('tab-' + tabName).classList.add('active'); 
            document.getElementById('menu-' + tabName)?.classList.add('active'); 
            history.replaceState(null, null, '#' + tabName);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            if (['dash', 'create', 'manage', 'bulk'].includes(hash)) switchTab(hash); else switchTab('dash');
        });

        window.createSpecialRoom = async () => {
            const roomId = document.getElementById('special-room-id').value.trim().toUpperCase();
            if (roomId.length < 3) return showPopup('Mã phòng phải có ít nhất 3 ký tự!', true);

            const timeRaw = document.getElementById('special-time').value;
            const incRaw = document.getElementById('special-inc').value;
            const breakCountRaw = document.getElementById('special-break-count').value;
            const breakTimeRaw = document.getElementById('special-break-time').value;

            const timeLimit = timeRaw === "" ? 10 : parseInt(timeRaw);
            const increment = incRaw === "" ? 5 : parseInt(incRaw);
            const breakCount = breakCountRaw === "" ? 1 : parseInt(breakCountRaw);
            const breakTime = breakTimeRaw === "" ? 60 : parseInt(breakTimeRaw);

            const { error } = await supabase.from('xiangqi_rooms').insert([{ 
                id: roomId, host_id: "ADMIN_PENDING", admin_locked: document.getElementById('special-status').value === 'locked',
                status: 'waiting', target_wins: parseInt(document.getElementById('special-target-wins').value),
                score_host: 0, score_guest: 0, host_ready: false, guest_ready: false, 
                turn: 'red', // 👉 ĐỎ ĐI TRƯỚC
                note: document.getElementById('special-note').value.trim() || null,
                settings: { timeLimit, increment, breakCount, breakTime }
            }]);

            if (error) return showPopup('Mã phòng này đã tồn tại!', true);
            showToast('Thành công!', `Phòng ${roomId} đã lên nòng!`, 'success');
        };

        window.deleteRoom = async (id) => {
            showConfirmPopup('XÓA PHÒNG', `Cậu chắc chắn muốn xóa phòng [${id}] không?`, async () => {
                await supabase.from('xiangqi_rooms').delete().eq('id', id);
                showToast('Đã xóa', `Phòng ${id} bay màu!`, 'success');
            });
        };

        window.loadRoomForManagement = async () => {
            const roomId = document.getElementById('manage-room-select').value || document.getElementById('manage-room-id').value.trim().toUpperCase();
            const { data: room } = await supabase.from('xiangqi_rooms').select('*').eq('id', roomId).single();
            if (!room) return showPopup('Không tìm thấy phòng!', true);

            document.getElementById('current-room-id').textContent = room.id;
            document.getElementById('red-player-name').textContent = room.host_info?.name || 'Chờ...';
            document.getElementById('black-player-name').textContent = room.guest_info?.name || 'Chờ...';
            document.getElementById('room-management-panel').style.display = 'block';
            document.getElementById('manage-room-id').value = room.id;
        };

        window.clearPlayer = async (position) => {
            const roomId = document.getElementById('current-room-id').textContent;
            showConfirmPopup("Đuổi VĐV", "Cậu muốn kick người này khỏi ghế?", async () => {
                await supabase.from('xiangqi_rooms').update({ 
                    [position === 'host' ? 'host_id' : 'guest_id']: position === 'host' ? "ADMIN_PENDING" : null, 
                    [position === 'host' ? 'host_info' : 'guest_info']: null 
                }).eq('id', roomId);
                showToast('Đã đuổi!', 'VĐV đã ra chuồng gà.', 'warning');
            });
        };

        window.swapPlayersManagement = async () => {
            const roomId = document.getElementById('current-room-id').textContent;
            const { data: room } = await supabase.from('xiangqi_rooms').select('*').eq('id', roomId).single();
            if (!room) return;
            await supabase.from('xiangqi_rooms').update({
                host_id: room.guest_id || "ADMIN_PENDING", guest_id: room.host_id === "ADMIN_PENDING" ? null : room.host_id,
                host_info: room.guest_info, guest_info: room.host_info, score_host: room.score_guest || 0, score_guest: room.score_host || 0
            }).eq('id', roomId);
            showToast('Đã tráo!', 'Tráo Đỏ/Đen thành công.', 'success');
        };

        window.startMatch = async () => {
            const roomId = document.getElementById('current-room-id').textContent;
            const { data: room } = await supabase.from('xiangqi_rooms').select('*').eq('id', roomId).single();
            if (!room.host_info || !room.guest_info) return showPopup('Chưa đủ 2 người!', true);
            await supabase.from('xiangqi_rooms').update({ status: 'playing', admin_locked: false, last_time_update: new Date().toISOString() }).eq('id', roomId);
            showToast('Bắt đầu!', 'Ván đấu đã khởi động', 'success');
        };

        window.selectAllRooms = () => document.querySelectorAll('.room-checkbox').forEach(cb => cb.checked = true);
        window.deselectAllRooms = () => document.querySelectorAll('.room-checkbox').forEach(cb => cb.checked = false);

        window.bulkLockSelected = async () => {
            const ids = Array.from(document.querySelectorAll('.room-checkbox:checked')).map(cb => cb.value);
            if (!ids.length) return showPopup('Chọn ít nhất 1 phòng!', true);
            await supabase.from('xiangqi_rooms').update({ admin_locked: true }).in('id', ids);
            showToast('Đã khóa!', `${ids.length} phòng bị đóng băng`, 'warning');
        };

        window.bulkUnlockSelected = async () => {
            const ids = Array.from(document.querySelectorAll('.room-checkbox:checked')).map(cb => cb.value);
            if (!ids.length) return showPopup('Chọn ít nhất 1 phòng!', true);
            await supabase.from('xiangqi_rooms').update({ admin_locked: false }).in('id', ids);
            showToast('Đã mở!', `${ids.length} phòng giải phóng`, 'success');
        };

        window.toggleLock = async (id, current) => { await supabase.from('xiangqi_rooms').update({ admin_locked: !current }).eq('id', id); };
        window.bulkUnlockRooms = async () => { showConfirmPopup('Mở tất cả', 'Mở toàn bộ bàn?', async () => { await supabase.from('xiangqi_rooms').update({ admin_locked: false }).eq('status', 'waiting'); }); };
        
        window.swapPlayers = async (id) => {
            const r = roomsData.find(x => x.id === id); if (!r) return;
            await supabase.from('xiangqi_rooms').update({
                host_id: r.guest_id || "ADMIN_PENDING", guest_id: r.host_id === "ADMIN_PENDING" ? null : r.host_id,
                host_info: r.guest_info, guest_info: r.host_info, score_host: r.score_guest || 0, score_guest: r.score_host || 0
            }).eq('id', id);
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) return window.redirectToLogin();
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists() && snap.data().role?.includes('admin')) {
                fetchRooms(); loadRoomSelectOptions(); loadBulkRoomList();
                supabase.channel('admin_rooms').on('postgres_changes', { event: '*', schema: 'public', table: 'xiangqi_rooms' }, () => { fetchRooms(); loadRoomSelectOptions(); loadBulkRoomList(); }).subscribe();
            } else { showPopup("Không có quyền!", true); setTimeout(() => window.location.href = '/game/xiangqi', 2000); }
        });

        async function fetchRooms() { const { data } = await supabase.from('xiangqi_rooms').select('*').order('created_at', { ascending: false }); roomsData = data || []; renderRooms(); }
        async function loadRoomSelectOptions() { const { data } = await supabase.from('xiangqi_rooms').select('id').order('created_at', { ascending: false }); document.getElementById('manage-room-select').innerHTML = '<option value="">-- Chọn --</option>' + data.map(r => `<option value="${r.id}">${r.id}</option>`).join(''); }
        async function loadBulkRoomList() {
            const { data } = await supabase.from('xiangqi_rooms').select('*').order('created_at', { ascending: false });
            document.getElementById('bulk-room-list').innerHTML = data.map(r => `
                <div class="room-item" style="padding:15px; margin-bottom:10px;"><input type="checkbox" class="room-checkbox" value="${r.id}" style="margin-right:15px;">
                <div style="flex:1"><b>Bàn ${r.id}</b><br><span style="color:#94a3b8; font-size:12px;">${r.host_info?.name||'Trống'} vs ${r.guest_info?.name||'Trống'}</span></div>
                <div class="badge ${r.admin_locked ? 'red' : 'green'}">${r.admin_locked ? 'Khóa' : 'Mở'}</div></div>`).join('');
        }

        function renderRooms() {
            document.getElementById('room-list-container').innerHTML = roomsData.map(room => `
                <div class="room-item">
                    <div style="flex:1">
                        <div style="font-weight: 900; color: #ef4444; font-size: 1.1rem;">Bàn: ${room.id}</div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <div class="player-slot"><span>${room.host_info?.name || 'Chờ...'}</span> <b style="color:#ef4444; background: rgba(239,68,68,0.1); padding: 2px 6px; border-radius:4px;">ĐỎ</b></div>
                            <div class="player-slot"><span>${room.guest_info?.name || 'Chờ...'}</span> <b style="color:#94a3b8; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius:4px;">ĐEN</b></div>
                        </div>
                        ${room.note ? `<div style="margin-top: 8px; font-size: 12px; color: #94a3b8;"><i class="fa-solid fa-sticky-note"></i> ${room.note}</div>` : ''}
                    </div>
                    <div style="display:flex; gap:8px; margin-left:20px; flex-wrap:wrap; justify-content: flex-end; width:150px;">
                        <button class="btn-admin btn-warning" onclick="window.swapPlayers('${room.id}')"><i class="fa-solid fa-arrows-rotate"></i></button>
                        <button class="btn-admin ${room.admin_locked ? 'btn-danger' : 'btn-success'}" onclick="window.toggleLock('${room.id}', ${room.admin_locked})">${room.admin_locked ? '<i class="fa-solid fa-lock"></i>' : '<i class="fa-solid fa-unlock"></i>'}</button>
                        <button class="btn-admin btn-primary" onclick="window.open('/game/xiangqi/play?id=${room.id}', '_blank')"><i class="fa-solid fa-eye"></i></button>
                        <button class="btn-admin" style="background: #475569;" onclick="window.deleteRoom('${room.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
