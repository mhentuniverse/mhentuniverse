<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Tuyệt Mật | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="stylesheet" href="/mhent-ui.css">
    <!-- ⚡ BỔ SUNG KHIÊN BẢO VỆ GIAO DIỆN MOBILE -->
    <link rel="stylesheet" href="/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="security-console" id="auth-box">
        <div class="warning-icon" id="status-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="glitch-text" id="status-title">CẢNH BÁO AN NINH</div>
        <div class="system-msg" id="status-desc">
            KHU VỰC LƯU TRỮ TUYỆT MẬT MHEnt<br><br>
            Hệ thống yêu cầu xác nhận danh tính. Mọi hành vi xâm nhập trái phép sẽ bị ghi vết IP và từ chối truy cập.
        </div>
        
        <button class="btn-auth" id="btn-login" onclick="goToLogin()">
            <i class="fa-solid fa-fingerprint"></i> Xác Thực Danh Tính
        </button>
        
        <div id="loading-msg" style="display: none; color: #10b981; font-weight: bold; margin-top: 20px; font-family: 'Nunito', sans-serif;">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang trích xuất mã khóa truy cập...
        </div>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", 
            authDomain: "mhentuniverse.firebaseapp.com", 
            projectId: "mhentuniverse", 
            storageBucket: "mhentuniverse.firebasestorage.app", 
            messagingSenderId: "377044322952", 
            appId: "1:377044322952:web:d657d1b0806d37d9246d3d" 
        };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect');
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // ⚡ NẠP CACHE ĐA VŨ TRỤ AN TOÀN BÊN TRONG .THEN()
                getDoc(doc(db, "users", user.uid)).then((uSnap) => {
                    const userData = uSnap.exists() ? uSnap.data() : {};
                    const userRole = userData.role || 'user';
                    localStorage.setItem('mhent_user_role', userRole);
                    localStorage.setItem('mhent_user_profile', JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        photoURL: user.photoURL || "/assets/avt-web.jpg",
                        role: userRole,
                        teamCinema: userData.teamCinema || userData.teamName || '',
                        teamArena: userData.teamArena || userData.teamName || '',
                        teamManga: userData.teamManga || userData.teamName || '',
                        teamMusic: userData.teamMusic || userData.teamName || '',
                        teamNovel: userData.teamNovel || userData.teamName || '',
                        teamEdu: userData.teamEdu || userData.teamTeach || userData.teamName || ''
                    }));
                }).catch(e => console.log("Lỗi nạp cache profile:", e));
            } else {
                localStorage.setItem('mhent_user_role', 'guest');
                localStorage.removeItem('mhent_user_profile');
            }
        });

        window.goToLogin = function() {
            if (redirectTarget) {
                sessionStorage.setItem('mhent_secret_redirect', redirectTarget);
            }
            
            if (currentUser) {
                document.getElementById('btn-login').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'block';
                
                document.getElementById('status-icon').innerHTML = '<i class="fa-solid fa-shield-check"></i>';
                document.getElementById('status-icon').style.color = '#10b981';
                document.getElementById('status-title').innerText = "TRUY CẬP HỢP LỆ";
                document.getElementById('status-title').style.color = "#10b981";
                document.getElementById('status-desc').innerHTML = `Đã xác thực Danh tính: <b style="color:white;">${currentUser.displayName || 'MHEnt Member'}</b>.<br>Đang thiết lập kết nối an toàn...`;
                
                showToast("Thành công", `Chào mừng cậu trở lại!`, "success");
                
                setTimeout(() => {
                    const savedRedirect = sessionStorage.getItem('mhent_secret_redirect');
                    const finalTarget = redirectTarget || savedRedirect;
                    if (finalTarget) {
                        sessionStorage.removeItem('mhent_secret_redirect');
                        window.location.href = '/secrets/detail?id=' + finalTarget;
                    } else {
                        window.location.href = '/secrets/lists';
                    }
                }, 1500);
            } else {
                showToast("Hệ thống", "Đang chuyển đến cổng đăng nhập...", "info");
                setTimeout(() => {
                    let returnPath = '/secrets/lists.html'; 
                    if (redirectTarget) {
                        returnPath = '/secrets/detail.html?id=' + redirectTarget; 
                    }
                    window.redirectToLogin(returnPath);
                }, 1200);
            }
        }
    </script>
</body>
</html>
