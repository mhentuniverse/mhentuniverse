<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đài Chỉ Huy - Cờ Tướng | MHEnt. Game</title>
    
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ===== COLOR THEME VARIABLES ===== */
        :root { --hub-color: #ef4444; --hub-bg: rgba(239, 68, 68, 0.1); }

        /* ===== CSS RESET & GLOBAL STYLES ===== */
        body, h1, h2, h3, h4, p, span, button, input, select, textarea, td, th { font-family: 'Nunito', sans-serif !important; }
        body { background: #f8fafc; overflow-x: hidden; margin: 0; padding: 0; transition: 0.3s; color: #1e293b; }
        body.dark-mode { background: #0f172a; color: #f8fafc; }

        /* ===== LAYOUT ===== */
        .admin-layout { display: flex; min-height: 100vh; padding-top: 70px; }
        
        /* ===== SIDEBAR ===== */
        .admin-sidebar { 
            width: 260px; 
            background: #fff; 
            border-right: 1px solid #e2e8f0; 
            padding: 30px 20px; 
            position: fixed; 
            height: calc(100vh - 70px); 
            overflow-y: auto; 
            z-index: 10; 
            box-sizing: border-box; 
        }

        .admin-menu-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 20px; 
            border-radius: 10px; 
            color: #64748b; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 5px; 
        }

        .admin-menu-item:hover { 
            background: #f1f5f9; 
            color: var(--hub-color); 
        }

        .admin-menu-item.active { 
            background: var(--hub-bg); 
            color: var(--hub-color); 
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.15); 
        }
        
        /* ===== CONTENT AREA ===== */
        .admin-content { 
            flex: 1; 
            margin-left: 260px; 
            padding: 40px; 
            max-width: 100%; 
            box-sizing: border-box; 
            overflow-x: hidden; 
        }

        .admin-title { 
            font-size: 28px; 
            font-weight: 900; 
            color: #1e293b; 
            margin: 0 0 30px 0; 
        }

        .admin-tab { 
            display: none; 
            animation: fadeIn 0.3s ease; 
        }

        .admin-tab.active { 
            display: block; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* ===== CARDS & WIDGETS ===== */
        .admin-card { 
            background: #fff; 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            border: 1px solid #e2e8f0; 
            margin-bottom: 30px; 
        }

        .dash-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }

        .dash-card { 
            background: #fff; 
            border-radius: 16px; 
            padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            border: 1px solid #e2e8f0; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }

        .dash-icon { 
            width: 60px; 
            height: 60px; 
            border-radius: 15px; 
            background: var(--hub-bg); 
            color: var(--hub-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 24px; 
        }

        .dash-info h3 { 
            font-size: 24px; 
            font-weight: 900; 
            margin: 0; 
            color: #1e293b; 
        }

        .dash-info p { 
            margin: 5px 0 0 0; 
            font-size: 13px; 
            font-weight: 700; 
            color: #64748b; 
        }

        /* ===== FORM STYLES ===== */
        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        .input-group { 
            margin-bottom: 20px; 
        }

        .input-group.full { 
            grid-column: 1 / -1; 
        }

        .input-group label { 
            display: block; 
            font-weight: 800; 
            color: #475569; 
            margin-bottom: 8px; 
            font-size: 14px; 
        }

        .admin-input, .admin-select, .admin-textarea { 
            width: 100%; 
            padding: 14px 18px; 
            border-radius: 12px; 
            border: 2px solid #e2e8f0; 
            background: #f8fafc; 
            font-size: 15px; 
            font-weight: 600; 
            outline: none; 
            transition: 0.3s; 
            box-sizing: border-box; 
        }

        .admin-input:focus, .admin-select:focus, .admin-textarea:focus { 
            border-color: var(--hub-color); 
            background: #fff; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1); 
        }

        .admin-textarea { 
            resize: vertical; 
            min-height: 100px; 
        }

        /* ===== BUTTONS ===== */
        .btn-admin { 
            background: var(--hub-color); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 15px; 
            cursor: pointer; 
            transition: 0.3s; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }

        .btn-admin:hover { 
            background: #d03d56; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); 
        }

        .btn-primary { 
            background: #3b82f6; 
        }

        .btn-primary:hover { 
            background: #2563eb; 
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); 
        }

        .btn-success { 
            background: #10b981; 
        }

        .btn-success:hover { 
            background: #059669; 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); 
        }

        .btn-warning { 
            background: #f59e0b; 
        }

        .btn-warning:hover { 
            background: #d97706; 
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); 
        }

        .btn-danger { 
            background: #ef4444; 
        }

        .btn-danger:hover { 
            background: #dc2626; 
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); 
        }

        /* ===== ROOM CARDS ===== */
        .room-item { 
            background: #fff; 
            border-radius: 16px; 
            padding: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #e2e8f0; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
            transition: 0.3s; 
        }

        .room-item:hover { 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border-color: var(--hub-color); 
        }

        .player-slot { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
            padding: 12px 16px; 
            background: #f1f5f9; 
            border-radius: 10px; 
            flex: 1; 
            border: 1px solid #e2e8f0; 
            font-weight: 600; 
        }

        /* ===== TABLES ===== */
        .admin-table-container { 
            overflow-x: auto; 
            background: #fff; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            margin-top: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
        }

        .admin-table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }

        .admin-table th { 
            background: #f1f5f9; 
            padding: 15px 20px; 
            font-weight: 900; 
            color: #475569; 
            border-bottom: 2px solid #e2e8f0; 
            white-space: nowrap; 
            font-size: 14px; 
            text-transform: uppercase; 
        }

        .admin-table td { 
            padding: 15px 20px; 
            border-bottom: 1px solid #e2e8f0; 
            color: #1e293b; 
            font-size: 14px; 
            font-weight: 600; 
            vertical-align: middle; 
        }

        .admin-table tr:hover td { 
            background: #f8fafc; 
        }

        /* ===== BADGES ===== */
        .badge { 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 800; 
            background: #e2e8f0; 
            color: #475569; 
        }

        .badge.green { 
            background: #dcfce7; 
            color: #10b981; 
        }

        .badge.red { 
            background: #fee2e2; 
            color: #ef4444; 
        }

        .badge.yellow { 
            background: #fef3c7; 
            color: #f59e0b; 
        }

        .badge.blue { 
            background: #dbeafe; 
            color: #3b82f6; 
        }

        /* ===== SECURITY SHIELD ===== */
        #security-shield { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #0f172a; 
            z-index: 99999; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            transition: 0.5s; 
        }

        /* ===== MODAL & POPUPS ===== */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(5px); 
            z-index: 99999; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            opacity: 1; 
            transition: 0.3s; 
        }

        .popup-box { 
            background: #fff; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            width: 90%; 
            max-width: 400px; 
            transform: scale(1); 
            transition: 0.3s; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
        }

        @keyframes popIn { 
            0% { transform: scale(0.5); opacity: 0; } 
            70% { transform: scale(1.05); opacity: 1; } 
            100% { transform: scale(1); opacity: 1; } 
        }

        .pop-active { 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }

        .popup-box.error { 
            border: 2px solid #ef4444; 
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3); 
        }

        .popup-box.success { 
            border: 2px solid #10b981; 
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3); 
        }

        /* ===== DARK MODE ===== */
        body.dark-mode .admin-sidebar { 
            background: #1e293b; 
            border-color: #334155; 
        }

        body.dark-mode .admin-menu-item:hover { 
            background: #334155; 
        }

        body.dark-mode .admin-content { 
            background: #0f172a; 
        }

        body.dark-mode .admin-title { 
            color: #f8fafc; 
        }

        body.dark-mode .admin-card, 
        body.dark-mode .dash-card, 
        body.dark-mode .room-item, 
        body.dark-mode .admin-table-container,
        body.dark-mode .popup-box { 
            background: #1e293b; 
            border-color: #334155; 
        }

        body.dark-mode .player-slot, 
        body.dark-mode .admin-input, 
        body.dark-mode .admin-select, 
        body.dark-mode .admin-textarea { 
            background: #0f172a; 
            border-color: #334155; 
            color: #cbd5e1; 
        }

        body.dark-mode .admin-input:focus, 
        body.dark-mode .admin-select:focus, 
        body.dark-mode .admin-textarea:focus { 
            background: #1e293b; 
            color: white; 
        }

        body.dark-mode .admin-table th { 
            background: #0f172a; 
            color: #94a3b8; 
            border-color: #334155; 
        }

        body.dark-mode .admin-table td { 
            border-color: #334155; 
            color: #cbd5e1; 
        }

        body.dark-mode .admin-table tr:hover td { 
            background: #0f172a; 
        }

        body.dark-mode .dash-info h3 { 
            color: #f8fafc; 
        }

        body.dark-mode .input-group label { 
            color: #cbd5e1; 
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 992px) {
            .admin-layout { 
                flex-direction: column; 
                padding-top: 70px; 
            }
            
            .admin-sidebar { 
                width: 100%; 
                position: relative; 
                height: auto; 
                border-right: none; 
                border-bottom: 1px solid #e2e8f0; 
                padding: 15px 20px; 
                display: flex; 
                overflow-x: auto; 
                white-space: nowrap; 
                z-index: 5; 
                -webkit-overflow-scrolling: touch; 
                box-sizing: border-box; 
            }

            .admin-sidebar > div:first-child { 
                display: none; 
            } 
            
            .admin-menu-item { 
                margin-bottom: 0; 
                margin-right: 10px; 
                flex-shrink: 0; 
                padding: 10px 15px; 
            }
            
            .admin-content { 
                margin-left: 0; 
                padding: 20px; 
            }
            
            .admin-title { 
                font-size: 22px; 
            }

            .form-grid { 
                grid-template-columns: 1fr; 
                gap: 15px; 
            }

            .admin-card { 
                padding: 20px; 
            }

            .dash-card { 
                flex-direction: column; 
                text-align: center; 
            }

            .dash-card .dash-info { 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
            }

            .room-item { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 15px; 
            }

            .room-item > div:last-child { 
                width: 100%; 
                display: flex; 
                gap: 8px; 
            }
        }

        @media (max-width: 480px) {
            .admin-content { 
                padding: 15px; 
            }

            .admin-card { 
                padding: 15px; 
                border-radius: 12px; 
            }

            .btn-admin { 
                padding: 10px 15px; 
                font-size: 14px; 
            }

            .player-slot { 
                padding: 10px 12px; 
            }

            .dash-grid { 
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>

    <nav class="navbar" style="position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;">
        <div class="nav-left">
            <a href="/game/xiangqi" style="display: flex; align-items: center; gap: 10px;">
                <img src="/assets/avt-web.jpg" class="avt-img">
                <span class="logo-name">MHEnt. Admin</span>
            </a>
        </div>
        <div class="nav-right">
            <button class="btn-theme" onclick="window.toggleDarkMode()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-menu-item active" onclick="window.switchTab('dash', this)"><i class="fa-solid fa-satellite-dish"></i> Đài Chỉ Huy</div>
            <div class="admin-menu-item" onclick="window.switchTab('history', this)"><i class="fa-solid fa-book"></i> Biên Bản</div>
        </aside>

        <main class="admin-content">
            <div id="tab-dash" class="admin-tab active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
                    <h1 style="margin: 0; font-weight: 900;">Xiangqi Control Panel</h1>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-admin btn-primary" onclick="window.createTournamentRoom()"><i class="fa-solid fa-hammer"></i> TẠO BÀN</button>
                        <button class="btn-admin btn-success" onclick="window.bulkUnlockRooms()"><i class="fa-solid fa-unlock"></i> MỞ TẤT CẢ</button>
                    </div>
                </div>
                <div id="room-list-container">
                    <p style="text-align: center; color: #94a3b8;">Đang kết nối dữ liệu...</p>
                </div>
            </div>

            <div id="tab-history" class="admin-tab">
                <h1 style="font-weight: 900;">Biên Bản Giải Đấu</h1>
                <p>Khu vực ghi chép kết quả thi đấu...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // 🔑 SẾP ĐIỀN THÔNG TIN SUPABASE VÀO ĐÂY NÈ
        // ==========================================
        const SB_URL = "URL_SUPABASE_CỦA_SẾP";
        const SB_KEY = "KEY_SUPABASE_CỦA_SẾP";
        
        // Firebase lấy từ data.js (Nếu data.js sếp nói trống, hãy điền config vào đây luôn)
        const firebaseConfig = {
            apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let roomsData = [];

        // --- GÁN HÀM RA WINDOW ĐỂ NÚT BẤM GỌI ĐƯỢC (FIX LỖI NOT DEFINED) ---
        window.toggleDarkMode = () => document.body.classList.toggle('dark-mode');

        window.switchTab = (tabName, el) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
        };

        window.createTournamentRoom = async () => {
            const id = prompt("Mã phòng (Ví dụ: CHUNGKET):");
            if(!id) return;
            const { error } = await supabase.from('xiangqi_rooms').insert([{ 
                id: id.toUpperCase(), admin_locked: true, status: 'waiting', target_wins: 2, score_host: 0, score_guest: 0
            }]);
            if(error) alert("Mã phòng đã tồn tại!");
        };

        window.toggleLock = async (id, current) => {
            await supabase.from('xiangqi_rooms').update({ admin_locked: !current }).eq('id', id);
        };

        window.bulkUnlockRooms = async () => {
            if(confirm("Mở khóa toàn bộ các bàn đang chờ?")) {
                await supabase.from('xiangqi_rooms').update({ admin_locked: false }).eq('status', 'waiting');
            }
        };

        window.swapPlayers = async (id) => {
            const r = roomsData.find(x => x.id === id);
            await supabase.from('xiangqi_rooms').update({
                host_id: r.guest_id, guest_id: r.host_id,
                host_info: r.guest_info, guest_info: r.host_info
            }).eq('id', id);
        };

        // --- KHỞI CHẠY & KIỂM TRA QUYỀN ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/login'; return; }
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists() && userSnap.data().role?.includes('admin')) {
                fetchRooms();
                supabase.channel('admin_rooms').on('postgres_changes', { event: '*', schema: 'public', table: 'xiangqi_rooms' }, fetchRooms).subscribe();
            } else {
                alert("Bạn không có quyền trọng tài!");
                window.location.href = '/game/xiangqi';
            }
        });

        async function fetchRooms() {
            const { data } = await supabase.from('xiangqi_rooms').select('*').order('created_at', { ascending: false });
            roomsData = data || [];
            renderRooms();
        }

        function renderRooms() {
            const list = document.getElementById('room-list-container');
            list.innerHTML = roomsData.map(room => `
                <div class="room-item">
                    <div style="flex:1">
                        <div style="font-weight: 900; color: #ef4444; font-size: 1.1rem;">Bàn: ${room.id}</div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <div class="player-slot"><span>${room.host_info?.name || 'Chờ...'}</span> <b style="color:#ef4444">ĐỎ</b></div>
                            <div class="player-slot"><span>${room.guest_info?.name || 'Chờ...'}</span> <b style="color:#64748b">ĐEN</b></div>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-left:20px;">
                        <button class="btn-admin btn-warning" onclick="window.swapPlayers('${room.id}')"><i class="fa-solid fa-arrows-rotate"></i></button>
                        <button class="btn-admin ${room.admin_locked ? 'btn-danger' : 'btn-success'}" onclick="window.toggleLock('${room.id}', ${room.admin_locked})">
                            ${room.admin_locked ? '<i class="fa-solid fa-lock"></i>' : '<i class="fa-solid fa-unlock"></i>'}
                        </button>
                        <button class="btn-admin btn-primary" onclick="window.open('/game/xiangqi/play?id=${room.id}', '_blank')"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
