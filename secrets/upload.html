<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dữ Liệu Tuyệt Mật | MHEnt</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Sửa .admin-container lại như vầy */
        .admin-container { 
            width: 100%; 
            max-width: 900px; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }     
           
        /* Form nhập liệu */
        .admin-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; padding: 20px; border-radius: 8px; backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #10b981; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #475569; color: white; border-radius: 5px; font-family: inherit; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #10b981; }
        
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        /* Bảng dữ liệu */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .data-table th, .data-table td { border: 1px solid #334155; padding: 10px; text-align: left; }
        .data-table th { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .data-table tr:nth-child(even) { background: rgba(30, 41, 59, 0.3); }
        
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2 style="color: #10b981; margin: 0;"><i class="fa-solid fa-server"></i> TRẠM ĐIỀU HÀNH DỮ LIỆU MẬT</h2>
        
        <div class="admin-card">
            <h3 id="form-title" style="margin-top: 0; color: #f1f5f9;">Thêm Hồ Sơ Mới</h3>
            <form id="upload-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Mã ID (VD: SDPC_1)</label>
                        <input type="text" id="file-id" class="form-control" placeholder="Mã định danh duy nhất" required>
                    </div>
                    <div class="form-group">
                        <label>Tên hiển thị</label>
                        <input type="text" id="file-name" class="form-control" placeholder="VD: MHEnt SDPC Tập 1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Loại tệp</label>
                        <select id="file-type" class="form-control">
                            <option value="video">Video / Phim</option>
                            <option value="document">Tài liệu / Hồ sơ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ngày lưu</label>
                        <input type="date" id="file-date" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mật khẩu giải nén</label>
                        <input type="text" id="file-pass" class="form-control" placeholder="Mật khẩu bí mật..." required>
                    </div>
                    <div class="form-group">
                        <label>Đường dẫn tải (Archive.org URL)</label>
                        <input type="url" id="file-url" class="form-control" placeholder="https://..." required>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn-auth" id="btn-submit" style="background: #10b981; color: black;">
                        <i class="fa-solid fa-upload"></i> LƯU DỮ LIỆU
                    </button>
                    <button type="button" class="btn-auth" id="btn-cancel" style="border-color: #64748b; color: #64748b; display: none;" onclick="resetForm()">
                        Hủy Chỉnh Sửa
                    </button>
                </div>
            </form>
        </div>

        <div class="admin-card" style="flex: 1; overflow-y: auto;">
            <h3 style="margin-top: 0; color: #f1f5f9;">Kho Dữ Liệu Hiện Tại</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Hồ Sơ</th>
                        <th>Ngày</th>
                        <th>Loại</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="admin-file-list">
                    <tr><td colspan="5" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div style="text-align: right;">
            <button class="btn-auth" style="width: auto; padding: 8px 20px; font-size: 13px;" onclick="window.location.href='/secrets/lists'">Về Sảnh Lưu Trữ</button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient('https://ctzkgchjheirxwejctvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0');
        const firebaseConfig = { apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse" };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);

        let isEditing = false;
        let currentData = [];

        // Kiểm tra đăng nhập (Sau này sếp có thể check thêm email để biết chắc đó là sếp nha)
        onAuthStateChanged(auth, (user) => { 
            if (!user) window.location.href = '/secrets'; 
            else fetchFiles(); 
        });

        // 1. TẢI DỮ LIỆU LÊN BẢNG
        async function fetchFiles() {
            const { data, error } = await supabase.from('secret_files').select('*').order('date', { ascending: false });
            if (error) { showToast("Lỗi", "Không thể lấy danh sách!", "error"); return; }
            
            currentData = data;
            const tbody = document.getElementById('admin-file-list');
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Chưa có dữ liệu nào.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(file => `
                <tr>
                    <td style="font-weight: bold; color: #10b981;">${file.id}</td>
                    <td>${file.name}</td>
                    <td>${file.date}</td>
                    <td>${file.type}</td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button class="btn-sm btn-edit" onclick="editFile('${file.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-sm btn-delete" onclick="deleteFile('${file.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // 2. LƯU (THÊM MỚI HOẶC CẬP NHẬT)
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                id: document.getElementById('file-id').value,
                name: document.getElementById('file-name').value,
                type: document.getElementById('file-type').value,
                date: document.getElementById('file-date').value,
                password: document.getElementById('file-pass').value,
                download_url: document.getElementById('file-url').value
            };

            showToast("Hệ thống", "Đang xử lý dữ liệu...", "info");

            const { data, error } = await supabase.from('secret_files').upsert(payload);
            
            if (error) {
                showToast("Lỗi", "Lưu thất bại: " + error.message, "error");
            } else {
                showToast("Thành công", isEditing ? "Đã cập nhật hồ sơ!" : "Đã thêm hồ sơ mới!", "success");
                resetForm();
                fetchFiles(); // Làm mới bảng
            }
        });

        // 3. CHUẨN BỊ CHỈNH SỬA
        window.editFile = function(id) {
            const file = currentData.find(f => f.id === id);
            if (!file) return;

            document.getElementById('file-id').value = file.id;
            document.getElementById('file-id').readOnly = true; // Khóa ID không cho sửa
            document.getElementById('file-id').style.opacity = '0.6';
            
            document.getElementById('file-name').value = file.name;
            document.getElementById('file-type').value = file.type;
            document.getElementById('file-date').value = file.date;
            document.getElementById('file-pass').value = file.password;
            document.getElementById('file-url').value = file.download_url;

            isEditing = true;
            document.getElementById('form-title').innerText = "Cập Nhật Hồ Sơ: " + id;
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-save"></i> CẬP NHẬT';
            document.getElementById('btn-cancel').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 4. XÓA DỮ LIỆU
        window.deleteFile = async function(id) {
            if (confirm(`Sếp có chắc chắn muốn XÓA VĨNH VIỄN hồ sơ ${id} không?`)) {
                const { error } = await supabase.from('secret_files').delete().eq('id', id);
                if (error) {
                    showToast("Lỗi", "Không thể xóa hồ sơ!", "error");
                } else {
                    showToast("Đã Xóa", `Hồ sơ ${id} đã bị thủ tiêu.`, "success");
                    fetchFiles();
                }
            }
        };

        // 5. LÀM SẠCH FORM
        window.resetForm = function() {
            document.getElementById('upload-form').reset();
            document.getElementById('file-id').readOnly = false;
            document.getElementById('file-id').style.opacity = '1';
            
            isEditing = false;
            document.getElementById('form-title').innerText = "Thêm Hồ Sơ Mới";
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-upload"></i> LƯU DỮ LIỆU';
            document.getElementById('btn-cancel').style.display = 'none';
        };
    </script>
    <script src="/bot-shield.js"></script>
</body>
</html>
