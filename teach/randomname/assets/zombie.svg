<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <filter id="zDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#99b898"/>
      <stop offset="100%" stop-color="#6b8e6f"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#543007"/>
    </linearGradient>
  </defs>

  <!-- Shadow on lawn -->
  <ellipse cx="60" cy="154" rx="32" ry="6" fill="rgba(0,0,0,0.3)"/>

  <!-- Back Arm (extended left) -->
  <g transform="translate(30, 68) rotate(12)">
    <rect x="-24" y="-7" width="28" height="12" rx="5" fill="#543007"/>
    <circle cx="-28" cy="-1" r="6" fill="#84a98c"/>
    <rect x="-35" y="-5" width="8" height="3" rx="1.5" fill="#84a98c"/>
  </g>

  <!-- Back Leg -->
  <path d="M52 110 L48 142 L42 148 L56 150 L58 142 L60 110 Z" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="40" y="146" width="18" height="7" rx="3" fill="#1c1917"/>

  <!-- Front Leg (tattered jeans) -->
  <path d="M68 110 L74 140 L82 148 L66 150 L64 138 L62 110 Z" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Exposed knee bone -->
  <circle cx="72" cy="130" r="3.5" fill="#f8fafc"/>
  <rect x="66" y="146" width="18" height="7" rx="3" fill="#292524"/>

  <!-- Body / Suit Torso -->
  <path d="M46 68 L78 68 L76 112 L44 112 Z" fill="url(#suitGrad)" stroke="#271604" stroke-width="2"/>
  
  <!-- White shirt & Red Tie -->
  <polygon points="58,68 64,68 66,80 56,80" fill="#f8fafc"/>
  <polygon points="61,72 65,72 67,95 61,102 59,95" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>

  <!-- Head -->
  <g filter="url(#zDrop)">
    <!-- Jaw & Face -->
    <path d="M44 32 C40 18 52 10 70 12 C88 14 94 28 92 42 C90 56 82 66 68 66 C54 66 45 52 44 32 Z" fill="url(#skinGrad)" stroke="#3a533c" stroke-width="2.5"/>
    
    <!-- Strands of hair -->
    <path d="M56 10 Q58 2 62 8" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M66 11 Q70 3 73 9" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Left Eye (Big comical PvZ eye) -->
    <circle cx="58" cy="32" r="10" fill="#fef08a" stroke="#3a533c" stroke-width="2"/>
    <circle cx="56" cy="32" r="4" fill="#000000"/>
    <circle cx="54" cy="30" r="1.5" fill="#ffffff"/>

    <!-- Right Eye (Small droopy eye) -->
    <circle cx="76" cy="30" r="7" fill="#fef08a" stroke="#3a533c" stroke-width="1.8"/>
    <circle cx="75" cy="30" r="2.8" fill="#000000"/>

    <!-- Crooked Nose -->
    <polygon points="66,35 69,42 63,42" fill="#527956"/>

    <!-- Goofy Open Mouth & Teeth -->
    <path d="M52 48 Q64 56 78 48 Q74 60 56 58 Z" fill="#3f1d24" stroke="#3a533c" stroke-width="1.5"/>
    <!-- Teeth -->
    <rect x="56" y="49" width="4" height="4" fill="#fef9c3" stroke="#713f12" stroke-width="0.8"/>
    <rect x="65" y="50" width="4" height="4" fill="#fef9c3" stroke="#713f12" stroke-width="0.8"/>
    <rect x="71" y="49" width="3.5" height="3" fill="#fef9c3" stroke="#713f12" stroke-width="0.8"/>
  </g>

  <!-- Front Arm (extended forward to the left) -->
  <g transform="translate(38, 72) rotate(-8)">
    <rect x="-26" y="-6" width="32" height="13" rx="5" fill="#78350f" stroke="#271604" stroke-width="1.5"/>
    <!-- Hand -->
    <circle cx="-30" cy="0" r="6.5" fill="#84a98c" stroke="#3a533c" stroke-width="1.5"/>
    <rect x="-38" y="-4" width="9" height="3" rx="1.5" fill="#84a98c"/>
    <rect x="-37" y="0" width="8" height="3" rx="1.5" fill="#84a98c"/>
  </g>
</svg>
