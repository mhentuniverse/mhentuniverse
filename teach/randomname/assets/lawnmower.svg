<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="mowerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="74" rx="42" ry="5" fill="rgba(0,0,0,0.3)"/>

  <!-- Metal Handle -->
  <path d="M12 25 L32 50 L38 50" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="23" r="4" fill="#334155"/>

  <!-- Main Motor Engine Block -->
  <rect x="25" y="32" width="55" height="30" rx="8" fill="url(#mowerBody)" stroke="#450a0a" stroke-width="2.5"/>
  <!-- Engine Grille -->
  <rect x="42" y="36" width="30" height="12" rx="3" fill="#334155"/>
  <line x1="46" y1="39" x2="46" y2="45" stroke="#94a3b8" stroke-width="2"/>
  <line x1="52" y1="39" x2="52" y2="45" stroke="#94a3b8" stroke-width="2"/>
  <line x1="58" y1="39" x2="58" y2="45" stroke="#94a3b8" stroke-width="2"/>
  <line x1="64" y1="39" x2="64" y2="45" stroke="#94a3b8" stroke-width="2"/>

  <!-- Big Back Wheel -->
  <circle cx="28" cy="62" r="14" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <circle cx="28" cy="62" r="6" fill="#cbd5e1"/>

  <!-- Front Blade Housing -->
  <path d="M72 45 L92 58 L72 65 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <circle cx="85" cy="64" r="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="85" cy="64" r="3" fill="#cbd5e1"/>
</svg>
