<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <radialGradient id="peaGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="snoutGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="peaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shadow on lawn -->
  <ellipse cx="60" cy="132" rx="34" ry="7" fill="rgba(0,0,0,0.28)"/>

  <!-- Base Root Leaves -->
  <path d="M60 125 C40 120 20 130 18 135 C35 138 55 132 60 125 Z" fill="#15803d" stroke="#052e16" stroke-width="2"/>
  <path d="M60 125 C80 120 102 130 104 135 C85 138 65 132 60 125 Z" fill="#16a34a" stroke="#052e16" stroke-width="2"/>
  <path d="M60 125 C50 115 45 135 48 137 C58 135 60 128 60 125 Z" fill="#22c55e" stroke="#052e16" stroke-width="2"/>

  <!-- Curved Stem -->
  <path d="M60 125 Q45 85 58 55" fill="none" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Back leaf / hair on head -->
  <path d="M52 40 C35 25 20 38 15 48 C30 52 45 48 52 40 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5" filter="url(#peaGlow)"/>

  <!-- Main Round Head -->
  <circle cx="62" cy="46" r="30" fill="url(#peaGrad)" stroke="#14532d" stroke-width="3" filter="url(#peaGlow)"/>

  <!-- Big Eyeballs -->
  <!-- Left Eye -->
  <ellipse cx="68" cy="38" rx="8" ry="12" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
  <ellipse cx="71" cy="38" rx="4.5" ry="7" fill="#0f172a"/>
  <circle cx="73" cy="35" r="2.5" fill="#ffffff"/>

  <!-- Shooting Snout / Mouth (Facing Right towards Zombies) -->
  <path d="M82 40 C95 36 108 34 114 42 C116 48 114 56 108 60 C95 64 82 58 82 52 Z" fill="url(#snoutGrad)" stroke="#14532d" stroke-width="3"/>
  <ellipse cx="112" cy="49" rx="4" ry="10" fill="#052e16"/>

  <!-- Cheerful leaf collar -->
  <path d="M58 88 C40 82 35 96 38 102 C50 98 56 92 58 88 Z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
</svg>
