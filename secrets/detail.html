<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Mã Tệp Tin | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="stylesheet" href="/mhent-ui.css">
    <!-- ⚡ BỔ SUNG KHIÊN BẢO VỆ GIAO DIỆN MOBILE -->
    <link rel="stylesheet" href="/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        .btn-admin {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid transparent;
            font-family: 'Nunito', sans-serif;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-admin:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="security-console" id="detail-box">
        <div id="lock-screen">
            <div class="warning-icon" style="color: #f59e0b;"><i class="fa-solid fa-lock-keyhole"></i></div>
            <div class="glitch-text" id="file-title">HỆ THỐNG KHÓA</div>
            <p class="system-msg">Vui lòng xác thực người thật để mở khóa liên kết tải về.</p>
            <div style="display: flex; justify-content: center; margin-bottom: 25px; overflow: hidden;">
                <div class="g-recaptcha" data-sitekey="6LcI-OMsAAAAAOJyAQa49iw54GuWK28Lih3aifop" data-callback="onCaptchaSuccess" data-theme="dark"></div>
            </div>
            <button class="btn-auth" style="border-color: #64748b; color: #94a3b8;" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Quay lại</button>
        </div>

        <div id="unlock-screen" style="display: none;">
            <div class="warning-icon" style="color: #10b981;"><i class="fa-solid fa-unlock"></i></div>
            <div class="glitch-text" id="unlocked-title" style="color: #10b981;">ĐÃ GIẢI MÃ</div>
            
            <div class="system-msg" style="text-align: left; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 12px; box-sizing: border-box; width: 100%; border: 1px solid #334155; margin-bottom: 20px;">
                <div style="margin-bottom: 12px; font-size: 15px;">Tệp tin: <strong id="res-name" style="color: #f8fafc;"></strong></div>
                <div style="margin-bottom: 15px; font-size: 14px;">Mật khẩu giải nén: <br>
                    <code id="res-pass" style="color: #10b981; font-size: 18px; font-family: 'Courier New', monospace; font-weight: 900; display: block; margin-top: 8px; padding: 10px; background: #000; text-align: center; border-radius: 6px; border: 1px dashed #10b981;"></code>
                </div>
                
                <button class="btn-admin" style="background: #334155; color: white; margin-bottom: 15px;" onclick="copyPass()">
                    <i class="fa-solid fa-copy"></i> Sao chép Mật Khẩu
                </button>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn-admin" id="btn-download-archive" style="flex: 1; background: #3b82f6; color: white; min-width: 140px;">
                        <i class="fa-solid fa-cloud-arrow-down"></i> TẢI TRỰC TIẾP
                    </button>
                    <button class="btn-admin" id="btn-download-drive" style="flex: 1; background: #10b981; color: #050505; display: none; min-width: 140px;">
                        <i class="fa-brands fa-google-drive"></i> GOOGLE DRIVE
                    </button>
                </div>
            </div>
            
            <button class="btn-admin" style="background: transparent; border: 1px solid #64748b; color: #94a3b8;" onclick="window.location.href='/secrets/lists'">
                <i class="fa-solid fa-list"></i> Về Danh Sách Lưu Trữ
            </button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient('https://ctzkgchjheirxwejctvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0');
        const auth = getAuth(!getApps().length ? initializeApp({ apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse" }) : getApp());
        const fileId = new URLSearchParams(window.location.search).get('id');

        onAuthStateChanged(auth, user => { 
            if (!user) {
                window.location.href = '/secrets?redirect=' + encodeURIComponent(fileId); 
            }
        });

        let secretUrl = ""; 
        let driveUrl = "";

        window.onCaptchaSuccess = async function() {
            showToast("Hệ thống", "Đang trích xuất dữ liệu tuyệt mật...", "info");
            const { data, error } = await supabase.from('secret_files').select('*').eq('id', fileId).single();
            
            if (error || !data) { showToast("Lỗi", "Không tìm thấy tệp tin!", "error"); return; }
            
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('unlock-screen').style.display = 'block';
            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-pass').innerText = data.password;
            
            secretUrl = data.download_url;
            driveUrl = data.drive_url;

            if (driveUrl && driveUrl.trim() !== "") {
                document.getElementById('btn-download-drive').style.display = 'inline-flex';
            } else {
                document.getElementById('btn-download-drive').style.display = 'none';
            }
            showToast("Thành công", "Giải mã hoàn tất!", "success");
        }

        document.getElementById('btn-download-archive').onclick = () => { if(secretUrl) window.open(secretUrl, '_blank'); };
        document.getElementById('btn-download-drive').onclick = () => { if(driveUrl) window.open(driveUrl, '_blank'); };
        
        window.copyPass = () => {
            const pass = document.getElementById('res-pass').innerText;
            navigator.clipboard.writeText(pass);
            showToast("Đã chép", "Đã sao chép Mật khẩu vào bộ nhớ!", "success");
        }
    </script>
</body>
</html>
