<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sảnh Lưu Trữ | MHEnt. Storage</title>   
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .list-container { width: 100%; max-width: 800px; height: 80vh; display: flex; flex-direction: column; padding: 20px; }
        .list-header { border-bottom: 2px solid #10b981; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .archive-title { color: #10b981; font-size: 20px; font-weight: bold; }
        .archive-count { color: #94a3b8; font-size: 14px; }
        .file-list { flex: 1; overflow-y: auto; padding-right: 10px; }
        .file-list::-webkit-scrollbar { width: 5px; }
        .file-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #1e293b; margin-bottom: 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; background: rgba(30, 41, 59, 0.4); }
        .file-item:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.05); transform: translateX(5px); }
        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-icon { font-size: 20px; color: #94a3b8; }
        .file-item:hover .file-icon { color: #10b981; }
        .file-name { font-weight: bold; color: #f1f5f9; }
        .file-date { font-size: 12px; color: #64748b; margin-top: 4px; }
        .tag-encrypted { font-size: 11px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <div class="archive-title"><i class="fa-solid fa-folder-tree"></i> KHO LƯU TRỮ TRUNG TÂM</div>
            <div class="archive-count" id="item-count">Đang quét dữ liệu...</div>
        </div>
        <div class="file-list" id="file-list">
            <div style="text-align: center; margin-top: 50px; color: #94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Đang truy xuất từ máy chủ...</div>
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <button class="btn-auth" style="width: auto; padding: 8px 20px; font-size: 13px; border-color: #ef4444; color: #ef4444;" onclick="exitHub()">
                <i class="fa-solid fa-right-from-bracket"></i> Rời khỏi Kho Mật
            </button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        // Supabase & Firebase Config
        const supabase = createClient('https://ctzkgchjheirxwejctvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0');
        const firebaseConfig = { apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse" };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = '/secrets'; else fetchSecretFiles(); });

        async function fetchSecretFiles() {
            const { data, error } = await supabase.from('secret_files').select('id, name, date, type').order('date', { ascending: false });
            if (error) { showToast("Lỗi", "Không thể trích xuất danh sách!", "error"); return; }
            
            const listEl = document.getElementById('file-list');
            document.getElementById('item-count').innerText = `${data.length} TỆP TIN ĐƯỢC TÌM THẤY`;
            listEl.innerHTML = data.map(file => `
                <div class="file-item" onclick="accessFile('${file.id}')">
                    <div class="file-info">
                        <div class="file-icon"><i class="fa-solid ${file.type === 'video' ? 'fa-file-video' : 'fa-file-shield'}"></i></div>
                        <div><div class="file-name">${file.name}</div><div class="file-date">Ngày lưu: ${file.date}</div></div>
                    </div>
                    <div class="status-tag tag-encrypted">Mã hóa</div>
                </div>
            `).join('');
        }

        window.accessFile = id => { showToast("Truy cập", "Đang mở hồ sơ...", "info"); setTimeout(() => window.location.href = `/secrets/detail?id=${id}`, 600); }
        window.exitHub = function() {
            window.location.href = '/'; // Trả về /index.html (Hub MHEnt)
        }
    </script>

    <script src="/bot-shield.js"></script>
</body>
</html>
