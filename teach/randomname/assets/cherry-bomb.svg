<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="60" cy="112" rx="42" ry="7" fill="rgba(0,0,0,0.3)"/>

  <!-- Burning Fuse Spark -->
  <path d="M60 22 Q60 8 72 4" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Spark fire -->
  <circle cx="73" cy="4" r="6" fill="#facc15"/>
  <circle cx="73" cy="4" r="3" fill="#ea580c"/>
  <circle cx="73" cy="4" r="1.5" fill="#ffffff"/>

  <!-- Stems connected to cherries -->
  <path d="M60 22 C48 30 38 45 35 60" stroke="#166534" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M60 22 C72 30 82 45 85 60" stroke="#166534" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Green leaf at junction -->
  <path d="M60 22 C50 15 42 22 45 28 C54 26 58 24 60 22 Z" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>

  <!-- Left Angry Cherry -->
  <g filter="url(#cShadow)">
    <circle cx="36" cy="74" r="28" fill="url(#cherryGrad)" stroke="#450a0a" stroke-width="2.5"/>
    <!-- Angry Eyes -->
    <ellipse cx="28" cy="68" rx="5.5" ry="7.5" fill="#ffffff"/>
    <circle cx="30" cy="69" r="3" fill="#000000"/>
    <ellipse cx="43" cy="68" rx="5.5" ry="7.5" fill="#ffffff"/>
    <circle cx="41" cy="69" r="3" fill="#000000"/>
    <!-- Angry Eyebrows -->
    <line x1="22" y1="60" x2="35" y2="65" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
    <line x1="49" y1="60" x2="36" y2="65" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
    <!-- Angry Grimace Mouth -->
    <path d="M26 84 Q36 78 46 84" stroke="#450a0a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Angry Cherry -->
  <g filter="url(#cShadow)">
    <circle cx="84" cy="74" r="28" fill="url(#cherryGrad)" stroke="#450a0a" stroke-width="2.5"/>
    <!-- Angry Eyes -->
    <ellipse cx="76" cy="68" rx="5.5" ry="7.5" fill="#ffffff"/>
    <circle cx="78" cy="69" r="3" fill="#000000"/>
    <ellipse cx="91" cy="68" rx="5.5" ry="7.5" fill="#ffffff"/>
    <circle cx="89" cy="69" r="3" fill="#000000"/>
    <!-- Angry Eyebrows -->
    <line x1="70" y1="60" x2="83" y2="65" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
    <line x1="97" y1="60" x2="84" y2="65" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M74 84 Q84 78 94 84" stroke="#450a0a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
