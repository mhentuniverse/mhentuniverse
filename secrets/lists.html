<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sảnh Lưu Trữ | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="stylesheet" href="/mhent-ui.css">
    <!-- ⚡ BỔ SUNG KHIÊN BẢO VỆ GIAO DIỆN MOBILE -->
    <link rel="stylesheet" href="/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ⚡ FIX LỖI TRÀN MÀN HÌNH: Khóa chiều cao tổng để né Bottom Nav */
        .list-container { 
            width: 100%; max-width: 850px; 
            max-height: calc(100vh - 90px); 
            display: flex; flex-direction: column; 
            padding: 25px 20px; box-sizing: border-box; 
        }
        .list-header { border-bottom: 2px solid #10b981; padding-bottom: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; flex-shrink: 0; }
        .archive-title { color: #10b981; font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .archive-count { color: #94a3b8; font-size: 14px; font-family: 'Nunito', sans-serif; font-weight: 700; }
        
        /* ⚡ THU NHỎ CHIỀU DÀI KHO TÀI LIỆU (Hạ xuống 52vh trên PC) */
        .file-list { 
            flex: 1; min-height: 0; /* Cho phép khung co lại khi màn hình nhỏ */
            overflow-y: auto; padding-right: 8px; 
            max-height: 52vh; 
        }
        .file-list::-webkit-scrollbar { width: 5px; }
        .file-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .file-list::-webkit-scrollbar-thumb:hover { background: #10b981; }

        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border: 1px solid #1e293b; margin-bottom: 10px; border-radius: 12px; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: rgba(30, 41, 59, 0.4); box-sizing: border-box; }
        .file-item:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.08); transform: translateX(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .file-info { display: flex; align-items: center; gap: 15px; min-width: 0; flex: 1; }
        .file-icon { font-size: 22px; color: #94a3b8; flex-shrink: 0; transition: 0.3s; }
        .file-item:hover .file-icon { color: #10b981; transform: scale(1.1); }
        .file-name { font-weight: bold; color: #f1f5f9; font-size: 15.5px; font-family: 'Nunito', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-date { font-size: 12px; color: #64748b; margin-top: 4px; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 15px; }
        .tag-encrypted { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-family: 'Nunito', sans-serif; font-weight: 900; text-transform: uppercase; border: 1px solid #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); flex-shrink: 0; margin-left: 10px; }
        
        .header-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .visit-badge { 
            color: #10b981; font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 800;
            background: rgba(16, 185, 129, 0.1); padding: 6px 14px; border-radius: 8px; 
            border: 1px solid rgba(16, 185, 129, 0.3); display: inline-flex; align-items: center; gap: 8px; 
        }

        /* ⚡ TỐI ƯU SIÊU CHUẨN CHO ĐIỆN THOẠI (< 640px) */
        @media (max-width: 640px) {
            .list-container { padding: 15px 12px; max-height: calc(100vh - 85px); }
            .file-list { max-height: 48vh !important; } /* Thu nhỏ còn 48vh là thấy rõ 2 nút liền! */
            .file-item { padding: 12px 14px; margin-bottom: 8px; }
            .archive-title { font-size: 18px; }
            .header-stats { align-items: flex-start; }
            .list-header { flex-direction: column; align-items: flex-start; margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <div class="archive-title"><i class="fa-solid fa-folder-tree"></i> KHO LƯU TRỮ TRUNG TÂM</div>
            <div class="header-stats">
                <div class="archive-count" id="item-count">Đang quét dữ liệu...</div>
                <div class="visit-badge"><i class="fa-solid fa-eye"></i> Tổng lượt truy cập: <span id="visit-count" style="color:#fff; font-weight:bold;">0</span></div>
            </div>
        </div>
        
        <div class="file-list" id="file-list">
            <div style="text-align: center; margin-top: 50px; color: #94a3b8; font-family: 'Nunito', sans-serif;"><i class="fa-solid fa-spinner fa-spin"></i> Đang truy xuất danh sách...</div>
        </div>
        
        <!-- ⚡ KHUNG NÚT BẤM BÊN DƯỚI ĐÃ ĐƯỢC KÉO LÊN RÕ RÀNG -->
        <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; flex-shrink: 0;">
            <button id="btn-admin-portal" class="btn-admin" style="background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid #3b82f6; display: none; padding: 10px 18px; font-size: 13.5px;" onclick="window.location.href='/secrets/upload'">
                <i class="fa-solid fa-server"></i> Quản Trị Hệ Thống
            </button>
            <button class="btn-auth" style="width: auto; padding: 10px 22px; font-size: 13.5px; border-color: #ef4444; color: #ef4444; margin-left: auto;" onclick="exitHub()">
                <i class="fa-solid fa-right-from-bracket"></i> Rời khỏi Kho Mật
            </button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient('https://ctzkgchjheirxwejctvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0');
        const firebaseConfig = { apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse" };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => { 
            if (!user) {
                window.location.href = '/secrets'; 
            } else { 
                fetchSecretFiles(); 
                // Kiểm tra quyền Admin/Creator để hiện nút Quản trị
                try {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    if (snap.exists()) {
                        const role = snap.data().role || '';
                        if (role.includes('admin') || role.includes('creator') || role.includes('secret')) {
                            document.getElementById('btn-admin-portal').style.display = 'inline-flex';
                        }
                    }
                } catch(e) {}
            }
        });

        async function fetchSecretFiles() {
            const { data, error } = await supabase.from('secret_files').select('id, name, date, type, views').order('date', { ascending: false });
            if (error) { showToast("Lỗi", "Không thể truy xuất danh sách!", "error"); return; }
            
            let totalSystemVisits = data.reduce((sum, file) => sum + (file.views || 0), 0);
            document.getElementById('visit-count').innerText = totalSystemVisits.toLocaleString('en-US');
            
            const listEl = document.getElementById('file-list');
            document.getElementById('item-count').innerText = `${data.length} TỆP TIN BÍ MẬT`;
            
            listEl.innerHTML = data.map(file => {
                let currentView = file.views || 0;
                return `
                <div class="file-item" onclick="accessFile('${file.id}', ${currentView})">
                    <div class="file-info">
                        <div class="file-icon"><i class="fa-solid ${file.type === 'video' ? 'fa-file-video' : 'fa-file-shield'}"></i></div>
                        <div style="min-width: 0;">
                            <div class="file-name">${file.name}</div>
                            <div class="file-date">
                                <span><i class="fa-regular fa-calendar"></i> ${file.date}</span>
                                <span style="color: #10b981;"><i class="fa-solid fa-eye"></i> ${currentView}</span>
                            </div>
                        </div>
                    </div>
                    <div class="status-tag tag-encrypted"><i class="fa-solid fa-lock"></i> Khóa</div>
                </div>
                `
            }).join('');
        }

        window.accessFile = (id, currentView) => { 
            let newView = currentView + 1;
            supabase.from('secret_files').update({ views: newView }).eq('id', id).then(() => {});
            showToast("Truy cập", "Đang mở tệp tin...", "info"); 
            setTimeout(() => window.location.href = `/secrets/detail.html?id=${id}`, 600); 
        }
        
        window.exitHub = function() { window.location.href = '/'; }
    </script>
</body>
</html>
