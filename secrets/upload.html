<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Kho Tuyệt Mật | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="stylesheet" href="/css/mhent-ui.css">
    <!-- ⚡ BỔ SUNG KHIÊN BẢO VỆ GIAO DIỆN MOBILE -->
    <link rel="stylesheet" href="/css/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .admin-container { 
            width: 100%; max-width: 950px; padding: 40px 20px; 
            display: flex; flex-direction: column; gap: 25px; box-sizing: border-box; 
        }
        .admin-card { background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; padding: 25px; border-radius: 12px; backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; color: #10b981; margin-bottom: 6px; font-weight: 800; font-size: 14px; font-family: 'Nunito', sans-serif; }
        .form-control { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.6); border: 1px solid #475569; color: white; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; font-family: 'Nunito', sans-serif; }
        .data-table th, .data-table td { border: 1px solid #334155; padding: 12px; text-align: left; }
        .data-table th { background: rgba(16, 185, 129, 0.15); color: #10b981; font-weight: 900; }
        .data-table tr:nth-child(even) { background: rgba(30, 41, 59, 0.4); }
        .data-table tr:hover { background: rgba(16, 185, 129, 0.05); }
        
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; font-weight: 800; font-family: 'Nunito', sans-serif; transition: 0.2s; }
        .btn-sm:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        
        .btn-admin { padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; border: 1px solid transparent; font-family: 'Nunito', sans-serif; font-size: 15px; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-admin:hover { transform: translateY(-2px); filter: brightness(1.1); }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 0; }
            .data-table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
    <script src="/js/config.js"></script>
</head>
<body>
    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #10b981; padding-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h2 style="color: #10b981; margin: 0; font-family: 'Courier New', monospace; font-size: 24px;"><i class="fa-solid fa-server"></i> TRẠM QUẢN TRỊ BÍ MẬT</h2>
            <button class="btn-auth" style="width: auto; padding: 8px 18px; font-size: 13px; border-color: #64748b; color: #94a3b8;" onclick="window.location.href='/secrets/lists'">
                <i class="fa-solid fa-arrow-left"></i> Về Sảnh Lưu Trữ
            </button>
        </div>
        
        <div class="admin-card">
            <h3 id="form-title" style="margin-top: 0; color: #f1f5f9; font-family: 'Nunito', sans-serif; font-size: 20px;">Thêm Tệp Tin Mới</h3>
            <form id="upload-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Mã ID (VD: SDPC_1)</label>
                        <input type="text" id="file-id" class="form-control" placeholder="Mã định danh duy nhất" required oninput="updatePreviewLink()">
                        <div id="preview-link-container" style="display: none; margin-top: 10px; font-size: 13px; background: rgba(16,185,129,0.1); padding: 12px; border-radius: 8px; border: 1px dashed #10b981;">
                            <div style="color: #94a3b8; margin-bottom: 5px;"><i class="fa-solid fa-link"></i> Link gốc Shortcut:</div>
                            <div id="preview-link-text" style="color: #10b981; word-break: break-all; font-weight: bold; margin-bottom: 10px;"></div>
                            <button type="button" class="btn-sm" style="background: #10b981; color: black; width: 100%;" onclick="copyPreviewLink()">
                                <i class="fa-solid fa-copy"></i> Copy Link Ngay
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Tên hiển thị</label>
                        <input type="text" id="file-name" class="form-control" placeholder="VD: MHEnt SDPC Tập 1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Loại tệp</label>
                        <select id="file-type" class="form-control">
                            <option value="video">Video / Phim</option>
                            <option value="document">Tài liệu / Hồ sơ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ngày ban hành</label>
                        <input type="date" id="file-date" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mật khẩu giải nén</label>
                        <input type="text" id="file-pass" class="form-control" placeholder="Mật khẩu tệp tin..." required>
                    </div>
                    <div class="form-group">
                        <label>Đường dẫn gốc (Archive/Terabox...)</label>
                        <input type="url" id="file-url" class="form-control" placeholder="https://..." required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Đường dẫn Drive (Tốc độ cao - Tự đổi thành Direct Download)</label>
                    <input type="url" id="file-drive" class="form-control" placeholder="https://drive.google.com/...">
                </div>
                
                <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
                    <button type="submit" class="btn-admin" id="btn-submit" style="background: #10b981; color: black; flex: 1;">
                        <i class="fa-solid fa-upload"></i> LƯU TỆP TIN
                    </button>
                    <button type="button" class="btn-admin" id="btn-cancel" style="border-color: #64748b; color: #94a3b8; display: none; background: transparent;" onclick="resetForm()">
                        Hủy Chỉnh Sửa
                    </button>
                </div>
            </form>
        </div>

        <div class="admin-card" style="flex: 1; overflow-y: auto;">
            <h3 style="margin-top: 0; color: #f1f5f9; font-family: 'Nunito', sans-serif; font-size: 20px;">Kho Dữ Liệu Hiện Tại</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên tệp tin</th>
                        <th>Ngày</th>
                        <th>Loại</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="admin-file-list">
                    <tr><td colspan="5" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/js/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient(window.supabaseUrl, window.supabaseKey);
        const firebaseConfig = window.firebaseConfig;
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isEditing = false;
        let currentData = [];

        // ⚡ VÁ LỖI AN NINH RBAC: CHỈ ADMIN / CREATOR MỚI ĐƯỢC VÀO TRANG NÀY!
        onAuthStateChanged(auth, async (user) => { 
            if (!user) {
                window.location.href = '/secrets'; 
            } else {
                try {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    const role = snap.exists() ? (snap.data().role || '') : '';
                    if (role.includes('admin') || role.includes('creator') || role.includes('secret')) {
                        fetchFiles(); // Đủ quyền hạn -> Cho tải dữ liệu
                    } else {
                        showPopup("Cảnh báo: Cậu không có quyền truy cập Trạm Quản Trị này!", true);
                        setTimeout(() => window.location.href = '/secrets/lists', 2000);
                    }
                } catch(e) {
                    window.location.href = '/secrets/lists';
                }
            }
        });

        async function fetchFiles() {
            const { data, error } = await supabase.from('secret_files').select('*').order('date', { ascending: false });
            if (error) { showToast("Lỗi", "Không thể tải danh sách!", "error"); return; }
            
            currentData = data;
            const tbody = document.getElementById('admin-file-list');
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Chưa có tệp tin nào.</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(file => `
                <tr>
                    <td style="font-weight: bold; color: #10b981; font-family: 'Courier New', monospace;">${file.id}</td>
                    <td style="font-weight: 700;">${file.name}</td>
                    <td>${file.date}</td>
                    <td><span style="background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; font-size: 12px;">${file.type}</span></td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button class="btn-sm" style="background: #10b981; color: black; margin-right: 4px;" onclick="copyShareLink('${file.id}')" title="Copy Link Chia Sẻ"><i class="fa-solid fa-link"></i></button>
                        <button class="btn-sm btn-edit" style="margin-right: 4px;" onclick="editFile('${file.id}')" title="Chỉnh sửa"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-sm btn-delete" onclick="deleteFile('${file.id}')" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function makeDriveDirectLink(url) {
            if (!url) return "";
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return url; 
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawDriveUrl = document.getElementById('file-drive').value;
            const directDriveUrl = makeDriveDirectLink(rawDriveUrl);
            
            const payload = {
                id: document.getElementById('file-id').value.trim(),
                name: document.getElementById('file-name').value.trim(),
                type: document.getElementById('file-type').value,
                date: document.getElementById('file-date').value,
                password: document.getElementById('file-pass').value.trim(),
                download_url: document.getElementById('file-url').value.trim(),
                drive_url: directDriveUrl
            };
            showToast("Hệ thống", "Đang lưu tệp tin...", "info");
            const { data, error } = await supabase.from('secret_files').upsert(payload);
            
            if (error) {
                showToast("Lỗi", "Lưu thất bại: " + error.message, "error");
            } else {
                showToast("Thành công", isEditing ? "Đã cập nhật tệp tin!" : "Đã lưu tệp tin mới!", "success");
                resetForm();
                fetchFiles(); 
            }
        });

        window.editFile = function(id) {
            const file = currentData.find(f => f.id === id);
            if (!file) return;
            document.getElementById('file-id').value = file.id;
            document.getElementById('file-id').readOnly = true; 
            document.getElementById('file-id').style.opacity = '0.6';
            
            document.getElementById('file-name').value = file.name;
            document.getElementById('file-type').value = file.type;
            document.getElementById('file-date').value = file.date;
            document.getElementById('file-pass').value = file.password;
            document.getElementById('file-url').value = file.download_url;
            document.getElementById('file-drive').value = file.drive_url || "";
            isEditing = true;
            document.getElementById('form-title').innerText = "Cập Nhật Tệp Tin: " + id;
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-save"></i> CẬP NHẬT TỆP TIN';
            document.getElementById('btn-cancel').style.display = 'inline-flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updatePreviewLink(); 
        };

        window.deleteFile = async function(id) {
            showConfirmPopup("Xóa Tệp Tin", `Cậu chắc chắn muốn xóa vĩnh viễn tệp tin [${id}] không?`, async () => {
                const { error } = await supabase.from('secret_files').delete().eq('id', id);
                if (error) {
                    showToast("Lỗi", "Không thể xóa tệp tin!", "error");
                } else {
                    showToast("Đã xóa", `Tệp tin ${id} đã bay màu.`, "success");
                    fetchFiles();
                }
            });
        };

        window.resetForm = function() {
            document.getElementById('upload-form').reset();
            document.getElementById('file-id').readOnly = false;
            document.getElementById('file-id').style.opacity = '1';
            
            isEditing = false;
            document.getElementById('form-title').innerText = "Thêm Tệp Tin Mới";
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-upload"></i> LƯU TỆP TIN';
            document.getElementById('btn-cancel').style.display = 'none';
            updatePreviewLink(); 
        };

        window.copyShareLink = function(id) {
            const shareUrl = `${window.location.origin}/secrets/detail?id=${id}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast("Đã chép", `Đã sao chép link chia sẻ của ${id}!`, "success");
            }).catch(err => {
                showToast("Lỗi", "Trình duyệt từ chối copy!", "error");
            });
        };

        window.updatePreviewLink = function() {
            const idVal = document.getElementById('file-id').value.trim();
            const container = document.getElementById('preview-link-container');
            const linkText = document.getElementById('preview-link-text');
            
            if (idVal) {
                const url = `${window.location.origin}/secrets/detail?id=${idVal}`;
                linkText.innerText = url;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        };

        window.copyPreviewLink = function() {
            const linkText = document.getElementById('preview-link-text').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                showToast("Đã chép", "Mang link này gắn vào Shortcut nhé!", "success");
            }).catch(err => {
                showToast("Lỗi", "Trình duyệt từ chối copy!", "error");
            });
        };
    </script>
</body>
</html>
