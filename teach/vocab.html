<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.mhentuniverse.com/teach/vocab" />
    <title>Vocabulary Display - MHEnt. Edu</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/teach/teach-theme.css">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 30px; gap: 20px; background: rgba(15,23,42,0.98); border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
        .topbar .left-group { display: flex; align-items: center; gap: 14px; }
        .topbar .page-title { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #fff; }
        .nav-button { background: #0f172a; border: 1px solid rgba(255,255,255,0.08); color: #f8fafc; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s; }
        .nav-button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.05); }

        .present-header { text-align: center; padding: 40px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        #present-status { font-size: 34px; font-weight: 900; color: var(--hub-color); text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.35); }
        .present-meaning { font-size: 30px; font-weight: 900; color: #fff; min-height: 70px; margin-top: 0; max-width: 820px; text-align: center; line-height: 1.2; padding: 24px 32px; border: 2px solid rgba(14,165,233,0.35); border-radius: 22px; background: rgba(15,23,42,0.85); box-shadow: 0 20px 50px rgba(14,165,233,0.08); }
        .present-subtitle { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }
        .mode-toggle-btn { background: #10b981; border: none; color: white; font-size: 14px; font-weight: 800; padding: 14px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 12px 24px rgba(16,185,129,0.25); transition: transform 0.2s, background 0.2s; }
        .mode-toggle-btn:hover { transform: translateY(-2px); }
        .mode-toggle-btn.challenge { background: #f59e0b; }
        
        .next-word-btn { background: #0ea5e9; border: none; color: white; font-size: 16px; font-weight: 800; padding: 14px 32px; border-radius: 12px; cursor: pointer; box-shadow: 0 12px 24px rgba(14,165,233,0.3); transition: transform 0.2s, background 0.2s; display: none; margin-top: 12px; }
        .next-word-btn:hover:not(:disabled) { transform: translateY(-2px); background: #0284c7; }
        .next-word-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .next-word-btn.active { display: inline-block; }

        .present-board { flex: 1; padding: 20px 30px 40px; display: flex; flex-direction: column; justify-content: center; }
        .word-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .word-card { background: rgba(30,41,59,0.92); border: 2px solid rgba(255,255,255,0.08); padding: 28px 18px; border-radius: 18px; font-size: 30px; font-weight: 900; color: white; cursor: pointer; transition: all 0.24s; display: flex; align-items: center; justify-content: center; text-align: center; user-select: none; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
        .word-card:hover { transform: translateY(-3px); border-color: rgba(14,165,233,0.4); box-shadow: 0 24px 50px rgba(14,165,233,0.12); }
        .word-card.correct { background: #10b981 !important; border-color: #059669 !important; transform: scale(1.05); }
        .word-card.incorrect { background: #ef4444 !important; border-color: #b91c1c !important; opacity: 0.8; pointer-events: none; }
        .word-card.disabled { pointer-events: none; }
        .word-card.covered { background: #0f172a; border-color: #1e293b; color: transparent; background-image: repeating-linear-gradient(45deg, #1e293b 25%, transparent 25%, transparent 75%, #1e293b 75%, #1e293b), repeating-linear-gradient(45deg, #1e293b 25%, #0f172a 25%, #0f172a 75%, #1e293b 75%, #1e293b); background-position: 0 0, 15px 15px; background-size: 30px 30px; box-shadow: none; pointer-events: auto !important; }
        .word-card.revealed-temp { background: #f59e0b; color: white; border-color: #d97706; pointer-events: auto; transform: scale(1.05); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }

        #waiting-msg { text-align: center; font-size: 30px; color: #64748b; font-weight: 800; margin-top: 150px; }
        
    </style>
</head>
<body>

    <div id="waiting-msg"><i class="fa-solid fa-satellite-dish fa-beat"></i><br><br>Đang chờ kết nối từ Máy tính Giáo viên...</div>

    <div class="topbar">
        <div class="left-group">
            <button class="nav-button" onclick="window.location.href='/teach'"><i class="fa-solid fa-arrow-left"></i> Quay lại</button>
            <div class="page-title">Đấu Trường Từ Vựng</div>
        </div>
        <button id="toggle-mode-btn" class="mode-toggle-btn" onclick="toggleChallengeMode()">Bật Sương mù</button>
    </div>

    <div id="game-container" style="display: none; height: 100%; flex-direction: column;">
        <div class="present-header">
            <div class="present-subtitle">HÃY TÌM TỪ CÓ NGHĨA LÀ</div>
            <div id="present-meaning" class="present-meaning">Chờ giáo viên chọn câu hỏi...</div>
            <div id="present-status">CHẾ ĐỘ BÌNH THƯỜNG</div>
            <button id="next-word-btn" class="next-word-btn" onclick="goToNextWord()"><i class="fa-solid fa-arrow-right"></i> Tiếp theo</button>
        </div>
        <div class="present-board"><div class="word-grid" id="present-grid"></div></div>
    </div>

    <script>
        function sendCmd(action, payload) { localStorage.setItem('mhent_edu_cmd', JSON.stringify({ action, payload, rand: Math.random() })); }

        let globalMode = 'normal', globalStrikes = 0, targetWord = null, strikesCurrent = 0, isQuestionActive = false, challengeTimer = null;
        let autoReveal = false, autoRevealIndex = 0, currentWordList = [], autoRevealTimer = null;

        function updateModeButton() {
            const btn = document.getElementById('toggle-mode-btn');
            if (!btn) return;
            if (globalMode === 'challenge') {
                btn.innerText = 'Tắt Sương mù';
                btn.classList.add('challenge');
            } else {
                btn.innerText = 'Bật Sương mù';
                btn.classList.remove('challenge');
            }
        }

        window.toggleChallengeMode = function() {
            globalMode = globalMode === 'challenge' ? 'normal' : 'challenge';
            if (isQuestionActive) {
                applyFog();
            } else {
                document.querySelectorAll('.word-card').forEach(c => c.classList.remove('covered', 'revealed-temp'));
            }
            document.getElementById('present-status').innerText = globalMode === 'challenge' ? 'CHẾ ĐỘ SƯƠNG MÙ' : 'CHẾ ĐỘ BÌNH THƯỜNG';
            document.getElementById('present-status').style.color = globalMode === 'challenge' ? '#f59e0b' : 'var(--hub-color)';
            updateModeButton();
        };

        function startAutoReveal() {
            if (!autoReveal || currentWordList.length === 0) return;
            autoRevealIndex = 0;
            updateNextButtonVisibility();
            goToNextWord();
        }
        
        function updateNextButtonVisibility() {
            const btn = document.getElementById('next-word-btn');
            if (autoReveal) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }
        
        function goToNextWord() {
            if (!autoReveal || currentWordList.length === 0) return;
            
            if (autoRevealIndex >= currentWordList.length) {
                autoRevealIndex = 0;
            }
            
            const word = currentWordList[autoRevealIndex];
            loadQuestion(word);
            autoRevealIndex++;
        }

        function processAdminCommand(data) {
            if (!data || !data.action) return;
            if(data.action === 'SYNC_DATA') { 
                globalMode = data.payload.mode; 
                globalStrikes = data.payload.strikes;
                autoReveal = data.payload.autoReveal || false;
                currentWordList = data.payload.order || [];
                document.getElementById('waiting-msg').style.display = 'none'; 
                document.getElementById('game-container').style.display = 'flex';
                document.getElementById('present-meaning').innerText = 'Chờ giáo viên chọn câu hỏi...';
                renderGrid(data.payload.order);
                updateModeButton();
                document.getElementById('present-status').innerText = globalMode === 'challenge' ? 'CHẾ ĐỘ SƯƠNG MÙ' : 'CHẾ ĐỘ BÌNH THƯỜNG';
                document.getElementById('present-status').style.color = globalMode === 'challenge' ? '#f59e0b' : 'var(--hub-color)';
                updateNextButtonVisibility();
                if (autoReveal) {
                    startAutoReveal();
                }
            }
            if(data.action === 'SHUFFLE') renderGrid(data.payload);
            if(data.action === 'SET_QUESTION') loadQuestion(data.payload);
            if(data.action === 'ADMIN_CLICK') {
                const card = document.querySelector(`.word-card[data-id="${data.payload}"]`);
                if(card) handleClick(card, data.payload);
            }
        }

        window.addEventListener('storage', e => {
            if(e.key !== 'mhent_edu_cmd') return;
            const data = JSON.parse(e.newValue);
            processAdminCommand(data);
        });

        function normalizeWordItem(item, index) {
            if (typeof item === 'string' || typeof item === 'number') {
                return { id: String(item), word: String(item) };
            }
            return {
                id: typeof item.id !== 'undefined' ? String(item.id) : String(item.word ?? item.text ?? item.label ?? index),
                word: String(item.word ?? item.text ?? item.label ?? item.id ?? item)
            };
        }

        function renderGrid(order) {
            const grid = document.getElementById('present-grid'); grid.innerHTML = '';
            order.forEach((item, index) => {
                const entry = normalizeWordItem(item, index);
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = entry.word;
                card.dataset.id = entry.id;
                card.onclick = () => handleClick(card, entry.id);
                grid.appendChild(card);
            });
            applyFog();
        }

        function shuffleCardPositions() {
            const grid = document.getElementById('present-grid');
            const cards = Array.from(grid.children);
            cards.sort(() => 0.5 - Math.random()).forEach(card => {
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('mhent_edu_cmd');
            if (stored) {
                try { processAdminCommand(JSON.parse(stored)); } catch (err) { console.warn('Không thể xử lý lệnh lưu trữ', err); }
            }
        });

        function loadQuestion(payload) {
            targetWord = payload; strikesCurrent = 0; isQuestionActive = true;
            document.getElementById('present-status').innerText = "HÃY TÌM TỪ CHÍNH XÁC!"; document.getElementById('present-status').style.color = "var(--hub-color)";
            document.getElementById('present-meaning').innerText = payload.meaning || '...';
            
            // 🔥 CHÌA KHÓA Ở ĐÂY: Mọi thẻ đều bị xóa sạch trạng thái đúng/sai, trở lại thành "đạn mù" bình đẳng!
            document.querySelectorAll('.word-card').forEach(card => card.classList.remove('incorrect', 'correct', 'disabled'));
            
            // Xáo trộn vị trí các thẻ từ mỗi lần câu hỏi thay đổi
            shuffleCardPositions();
            
            applyFog();
        }

        function handleClick(card, selectedId) {
            if(!isQuestionActive || card.classList.contains('disabled')) return;
            card.classList.remove('covered');

            if(selectedId === targetWord.id) { // ĐÚNG
                clearInterval(challengeTimer);
                if(globalMode === 'challenge') document.querySelectorAll('.word-card').forEach(c => c.classList.remove('covered', 'revealed-temp'));
                
                card.classList.add('correct'); isQuestionActive = false;
                document.getElementById('present-status').innerText = "🎉 XUẤT SẮC!"; document.getElementById('present-status').style.color = "#10b981";
                document.querySelectorAll('.word-card').forEach(c => c.classList.add('disabled'));

                sendCmd('SYNC_COLOR', { id: selectedId, status: 'correct' });
                sendCmd('REPORT_SOLVED', targetWord); // Báo về cho Admin gạch chéo câu hỏi
            } else { // SAI
                card.classList.add('incorrect', 'disabled'); strikesCurrent++;
                sendCmd('SYNC_COLOR', { id: selectedId, status: 'incorrect' });

                if(strikesCurrent > globalStrikes) { // HẾT MẠNG
                    clearInterval(challengeTimer);
                    if(globalMode === 'challenge') document.querySelectorAll('.word-card').forEach(c => c.classList.remove('covered', 'revealed-temp'));
                    
                    document.querySelector(`.word-card[data-id="${targetWord.id}"]`).classList.add('correct');
                    sendCmd('SYNC_COLOR', { id: targetWord.id, status: 'correct' });
                    
                    isQuestionActive = false;
                    document.getElementById('present-status').innerText = "RẤT TIẾC! HẾT LƯỢT CHỌN!"; document.getElementById('present-status').style.color = "#ef4444";
                    document.querySelectorAll('.word-card').forEach(c => c.classList.add('disabled'));
                    sendCmd('REPORT_SOLVED', targetWord);
                } else {
                    document.getElementById('present-status').innerText = `SAI RỒI! CÒN ${globalStrikes - strikesCurrent + 1} LƯỢT!`;
                    document.getElementById('present-status').style.color = "#f59e0b";
                }
            }
        }

        function applyFog() {
            clearInterval(challengeTimer);
            if(globalMode !== 'challenge' || !isQuestionActive) { document.querySelectorAll('.word-card').forEach(c => c.classList.remove('covered', 'revealed-temp')); return; }

            // Không còn lọc solved-past nữa, TẤT CẢ đều bị sương mù che phủ
            const cards = Array.from(document.querySelectorAll('.word-card'));
            cards.forEach(c => c.classList.add('covered'));

            challengeTimer = setInterval(() => {
                if(!isQuestionActive) { clearInterval(challengeTimer); return; }
                cards.forEach(c => c.classList.remove('revealed-temp'));
                
                const available = cards.filter(c => !c.classList.contains('incorrect'));
                if(available.length > 0) {
                    let num = Math.max(1, Math.round(available.length / 5));
                    available.sort(() => 0.5 - Math.random()).slice(0, num).forEach(c => c.classList.add('revealed-temp'));
                }
            }, 1500);
        }
    </script>
    <script src="/mhent-ui.js"></script>
    <script>
    // =========================================================
    // 🚀 CHIP NHẬN DỮ LIỆU TỪ MÂY: ĐẤU TRƯỜNG TỪ VỰNG (VOCAB)
    // =========================================================
    document.addEventListener("DOMContentLoaded", async () => {
        const gameId = new URLSearchParams(window.location.search).get('id');
        
        if (gameId) {
            const waitingMsg = document.getElementById('waiting-msg');
            if(waitingMsg) waitingMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><br><br>Đang tải giáo án từ Két sắt Đám Mây...';
            
            try {
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2D9oAH4Q21Xf9NZls3J2Ojh7jCZB_H6iIg9dISJaBF79GXiJNr7AwFi819Rt_kctaeQ/exec";
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getGameById', gameType: 'vocab', rowId: gameId })
                });
                let result = await res.json();
                
                if (result.success) {
                    const payload = result.gameData;
                    
                    // Nạp dữ liệu vào biến toàn cục của Vocab
                    globalMode = payload.mode || 'normal';
                    globalStrikes = payload.strikes || 1;
                    autoReveal = payload.autoReveal || false;
                    currentWordList = [...(payload.globalWordList || [])].sort(() => 0.5 - Math.random());
                    
                    // Tạo một trật tự xáo trộn cho mảng từ vựng lấy từ Đám mây
                    const shuffledOrder = [...(payload.globalWordList || [])].sort(() => 0.5 - Math.random());
                    
                    document.getElementById('waiting-msg').style.display = 'none'; 
                    document.getElementById('game-container').style.display = 'flex';
                    
                    // Vẽ lưới từ vựng ra màn hình
                    renderGrid(shuffledOrder);
                    updateModeButton();
                    updateNextButtonVisibility();
                    document.getElementById('present-status').innerText = globalMode === 'challenge' ? 'CHẾ ĐỘ SƯƠNG MÙ' : 'CHẾ ĐỘ BÌNH THƯỜNG';
                    document.getElementById('present-status').style.color = globalMode === 'challenge' ? '#f59e0b' : 'var(--hub-color)';
                    
                    if (autoReveal) {
                        startAutoReveal();
                    }
                    
                    if (typeof showToast === 'function') {
                        showToast("Sẵn sàng!", `Giáo án: ${result.dataName || 'Đã mở giáo án'}` + (autoReveal ? " (Tự động)" : ""), "success");
                    } else {
                        console.log('Sẵn sàng! Giáo án:', result.dataName || 'Đã mở giáo án');
                    }

                } else {
                    if(waitingMsg) waitingMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><br><br>Lỗi: Không tìm thấy giáo án này!`;
                }
            } catch(e) {
                if(waitingMsg) waitingMsg.innerHTML = `<i class="fa-solid fa-wifi"></i><br><br>Lỗi mạng rồi cậu ơi!`;
            }
        }
    });
    </script>
    <script src="/check-token.js"></script>
    <script type="module" src="/maintenance.js"></script>
</body>
</html>
