  <!-- Sulci / Curvy wrinkles -->
  <path d="M 28 30 Q 38 35 32 48" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 22 42 Q 35 48 26 58" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 72 30 Q 62 35 68 48" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 78 42 Q 65 48 74 58" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Top crease -->
  <line x1="50" y1="14" x2="50" y2="70" stroke="#831843" stroke-width="3" stroke-linecap="round"/>
</svg>
