<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.mhentuniverse.com/teach/unscram" />
    <title>Unscramble Sentences - MHEnt. Edu</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/teach/teach-theme.css"> 
    <link rel="stylesheet" href="/css/mhent-ui.css">
    <link rel="stylesheet" href="/css/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; height: 100vh; background: #0f172a; color: white; font-family: 'Nunito', sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #waiting-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 30px; color: #64748b; font-weight: 800; }

        #main-game { display: none; height: 100vh; flex-direction: column; width: 100%; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1e293b; border-bottom: 2px solid #334155; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 10; }
        .header h1 { margin: 0; font-size: 24px; color: #0ea5e9; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn-game { padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; font-family: 'Nunito'; color: white; }
        .btn-shuffle { background: linear-gradient(135deg, #ef4444, #f43f5e); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }
        .btn-reveal { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
        .btn-nav { background: #334155; color: white; box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .btn-game:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-game:active { transform: translateY(1px); }

        .speed-control { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 5px 15px; border-radius: 20px; border: 1px solid #475569; }
        .speed-control input[type="range"] { accent-color: #0ea5e9; cursor: pointer; }

        .arena { flex: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); overflow: hidden; }
        
        /* 🔥 CẤU CẤU LẠI CSS ĐỂ NHẬN ĐA MÀU SẮC */
        .word-block { 
            position: absolute; top: 0; left: 0; padding: 15px 25px; 
            font-size: 28px; font-weight: 900; border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.2); 
            border: 2px solid rgba(255, 255, 255, 0.3); /* Viền mờ mặc định */
            user-select: none; white-space: nowrap;
            transform-origin: center center;
            color: white; /* Mặc định chữ trắng */
        }

        /* 🌈 6 LỚP MÀU ĐẠI DIỆN CHO 6 CON NGƯỜI CỦA CÔNG TY */
        .block-turquoise { background: linear-gradient(135deg, #2dd4bf, #14b8a6); border-color: #5eead4; }
        .block-pink { background: linear-gradient(135deg, #f472b6, #db2777); border-color: #f9a8d4; }
        .block-yellow { background: linear-gradient(135deg, #facc15, #f59e0b); border-color: #fbef7e; color: #1e293b; } /* Chữ tối màu cho dễ đọc */
        .block-purple { background: linear-gradient(135deg, #c084fc, #9333ea); border-color: #d8b4fe; }
        .block-silver { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); border-color: #f1f5f9; color: #1e293b; } /* Chữ tối màu cho dễ đọc */
        .block-lightblue { background: linear-gradient(135deg, #38bdf8, #0ea5e9); border-color: #7dd3fc; }

        .sentence-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.8); padding: 5px 20px; border-radius: 20px; font-weight: 800; color: #94a3b8; border: 1px solid #334155; }

        /* 🔤 KIỂU Ô CHỮ CÁI CHO CHẾ ĐỘ WORD (TỪ ĐƠN) */
        .letter-block {
            min-width: 64px;
            height: 64px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border-radius: 18px;
            box-sizing: border-box;
            line-height: 1;
        }
        .letter-medium {
            min-width: 52px;
            height: 52px;
            padding: 0 10px;
            font-size: 26px;
            border-radius: 14px;
        }
        .letter-compact {
            min-width: 44px;
            height: 44px;
            padding: 0 6px;
            font-size: 22px;
            border-radius: 12px;
        }
        #mode-badge {
            font-size: 13px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(14, 165, 233, 0.4);
            margin-left: 14px;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }

        /* 💡 GỢI Ý / CÂU HỎI SUY LUẬN CHO TỪ VÀ CÂU */
        .question-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 82%;
            min-width: 320px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(14, 165, 233, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(14, 165, 233, 0.25);
            padding: 12px 28px;
            text-align: center;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            animation: fadeInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -15px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .question-badge {
            font-size: 13px;
            font-weight: 900;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .question-text {
            font-size: clamp(18px, 2.2vw, 26px);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            word-break: break-word;
        }
        .btn-hint {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-hint.hint-off {
            background: #475569;
            box-shadow: none;
            opacity: 0.85;
        }
    </style>
    <script src="/js/config.js"></script>
</head>
<body>

    <div id="waiting-msg"><i class="fa-solid fa-hurricane fa-spin"></i><br><br>Waiting for connection...</div>

    <div id="main-game">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/teach/admin" style="color: #94a3b8; font-size: 24px; transition: 0.2s;"><i class="fa-solid fa-circle-arrow-left"></i></a>
                <div style="display: flex; align-items: center;">
                    <h1><i class="fa-solid fa-hurricane"></i> Word Tornado</h1>
                    <span id="mode-badge" style="display: none;"></span>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn-game btn-nav" onclick="prevSentence()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-game btn-nav" onclick="nextSentence()"><i class="fa-solid fa-forward-step"></i></button>
                
                <div class="speed-control">
                    <i class="fa-solid fa-gauge-high" style="color: #0ea5e9;"></i>
                    <input type="range" id="speed-slider" min="1" max="10" value="2">
                </div>

                <button id="btn-toggle-hint" class="btn-game btn-hint" onclick="toggleHint()" style="display: none;" title="Bật/Tắt câu hỏi gợi ý (Phím H)"><i class="fa-solid fa-lightbulb"></i> ẨN GỢI Ý</button>
                <button class="btn-game btn-shuffle" onclick="startShuffle()"><i class="fa-solid fa-shuffle"></i> LỐC XOÁY</button>
                <button class="btn-game btn-reveal" onclick="revealAnswer()"><i class="fa-solid fa-check-double"></i> XẾP LẠI</button>
            </div>
        </div>

        <div class="arena" id="arena">
            <div id="question-banner" class="question-banner" style="display: none;">
                <div class="question-badge"><i class="fa-solid fa-lightbulb"></i> GỢI Ý / CÂU HỎI SUY LUẬN</div>
                <div id="question-text" class="question-text"></div>
            </div>
            <div class="sentence-counter" id="counter">Câu 0 / 0</div>
        </div>
    </div>
    <script src="/js/mhent-ui.js"></script>
    <script>
        let sentenceList = [];
        let wordList = [];
        let pairList = [];
        let currentIndex = 0;
        let currentMode = 'sentence';
        let columnColors = { left: '#ef4444', right: '#38bdf8' };
        let blocks = [];
        let animationId;
        let isMoving = false;
        let currentQuestion = '';
        let isQuestionVisible = true;

        // 🔥 DANH SÁCH 6 LỚP MÀU TƯƠNG ỨNG VỚI 6 TRỤ CỘT
        const colorClasses = ['block-turquoise', 'block-pink', 'block-yellow', 'block-purple', 'block-silver', 'block-lightblue'];

        function normalizeGameItems(data, fallbackKey) {
            if (!data) return [];
            if (typeof data === 'object' && !Array.isArray(data)) {
                if (data.items && Array.isArray(data.items) && data.items.length > 0) {
                    return data.items.map(it => {
                        if (typeof it === 'string') {
                            const parts = it.split('|');
                            return { text: parts[0].trim(), question: parts.length > 1 ? parts.slice(1).join('|').trim() : '' };
                        }
                        return {
                            text: (it.text || it.word || it.sentence || '').trim(),
                            question: (it.question || it.hint || it.clue || '').trim()
                        };
                    }).filter(it => it.text);
                }
                const list = data[fallbackKey] || data.words || data.sentences || [];
                return normalizeGameItems(list, fallbackKey);
            }
            if (Array.isArray(data)) {
                return data.map(it => {
                    if (typeof it === 'object' && it !== null) {
                        return {
                            text: (it.text || it.word || it.sentence || '').trim(),
                            question: (it.question || it.hint || it.clue || '').trim()
                        };
                    }
                    const str = String(it).trim();
                    const parts = str.split('|');
                    return {
                        text: parts[0].trim(),
                        question: parts.length > 1 ? parts.slice(1).join('|').trim() : ''
                    };
                }).filter(it => it.text);
            }
            return [];
        }

        function updateQuestionDisplay(questionText) {
            currentQuestion = (questionText || '').trim();
            const banner = document.getElementById('question-banner');
            const qTextEl = document.getElementById('question-text');
            const hintBtn = document.getElementById('btn-toggle-hint');

            if (!banner || !qTextEl) return;

            if (currentQuestion) {
                qTextEl.textContent = currentQuestion;
                isQuestionVisible = true;
                banner.style.display = 'flex';
                banner.classList.remove('hidden-hint');
                if (hintBtn) {
                    hintBtn.style.display = 'inline-flex';
                    hintBtn.innerHTML = '<i class="fa-solid fa-lightbulb"></i> ẨN GỢI Ý';
                    hintBtn.classList.remove('hint-off');
                }
            } else {
                banner.style.display = 'none';
                if (hintBtn) {
                    hintBtn.style.display = 'none';
                }
            }
        }

        function toggleHint() {
            if (!currentQuestion) return;
            const banner = document.getElementById('question-banner');
            const hintBtn = document.getElementById('btn-toggle-hint');
            isQuestionVisible = !isQuestionVisible;

            if (banner) {
                if (isQuestionVisible) {
                    banner.style.display = 'flex';
                    banner.classList.remove('hidden-hint');
                } else {
                    banner.style.display = 'none';
                    banner.classList.add('hidden-hint');
                }
            }

            if (hintBtn) {
                if (isQuestionVisible) {
                    hintBtn.innerHTML = '<i class="fa-solid fa-lightbulb"></i> ẨN GỢI Ý';
                    hintBtn.classList.remove('hint-off');
                } else {
                    hintBtn.innerHTML = '<i class="fa-regular fa-lightbulb"></i> HIỆN GỢI Ý';
                    hintBtn.classList.add('hint-off');
                }
            }
        }

        window.addEventListener('storage', e => {
            if(e.key !== 'mhent_unscram_cmd') return;
            const data = JSON.parse(e.newValue);
            if(data.action === 'SYNC') {
                processGamePayload(data.payload);
                showToast("Nhận lệnh!", "Dữ liệu mới đã được nạp từ Admin!", "success");
            }
        });

        function updateModeBadge(mode) {
            const badge = document.getElementById('mode-badge');
            if (!badge) return;
            badge.style.display = 'inline-block';
            if (mode === 'word') {
                badge.innerText = 'Word Mode (Xếp Chữ Cái)';
                badge.style.color = '#38bdf8';
                badge.style.borderColor = 'rgba(56, 189, 248, 0.4)';
                badge.style.background = 'rgba(56, 189, 248, 0.15)';
            } else if (mode === 'columns') {
                badge.innerText = 'Column Mode (Cột Màu)';
                badge.style.color = '#38bdf8';
                badge.style.borderColor = 'rgba(56, 189, 248, 0.4)';
                badge.style.background = 'rgba(56, 189, 248, 0.15)';
            } else {
                badge.innerText = 'Sentence Mode (Ghép Câu)';
                badge.style.color = '#38bdf8';
                badge.style.borderColor = 'rgba(14, 165, 233, 0.4)';
                badge.style.background = 'rgba(14, 165, 233, 0.15)';
            }
        }

        function processGamePayload(payload) {
            if (!payload) return;
            document.getElementById('waiting-msg').style.display = 'none';
            document.getElementById('main-game').style.display = 'flex';

            if (payload.mode === 'columns') {
                initColumnsGame(payload);
            } else if (payload.mode === 'word') {
                initWordGame(payload);
            } else {
                initSentenceGame(payload);
            }
        }

        function initSentenceGame(payloadOrList) {
            currentMode = 'sentence';
            updateModeBadge('sentence');
            sentenceList = normalizeGameItems(payloadOrList, 'sentences');
            currentIndex = 0;
            loadSentence(currentIndex);
        }

        function initWordGame(payloadOrList) {
            currentMode = 'word';
            updateModeBadge('word');
            wordList = normalizeGameItems(payloadOrList, 'words');
            currentIndex = 0;
            loadWord(currentIndex);
        }

        function initColumnsGame(payload) {
            currentMode = 'columns';
            updateModeBadge('columns');
            updateQuestionDisplay('');
            pairList = (payload.pairs || []).filter(pair => pair.left && pair.right);
            columnColors = payload.columnColors || columnColors;
            loadColumns();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id');
            const waitingMsg = document.getElementById('waiting-msg');

            if (gameId) {
                if(waitingMsg) waitingMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><br><br>Đang tải giáo án từ Két sắt Đám Mây...';
                
                try {
                    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2D9oAH4Q21Xf9NZls3J2Ojh7jCZB_H6iIg9dISJaBF79GXiJNr7AwFi819Rt_kctaeQ/exec";
                    let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getGameById', gameType: 'unscram', rowId: gameId }) });
                    let result = await res.json();
                    
                    if (result.success) {
                        processGamePayload(result.gameData);
                        showToast("Sẵn sàng!", `Giáo án: ${result.dataName || 'Unscramble'}`, "success");
                    } else {
                        if(waitingMsg) waitingMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i><br><br>Lỗi: Không tìm thấy mã giáo án này!`;
                    }
                } catch(e) {
                    if(waitingMsg) waitingMsg.innerHTML = `<i class="fa-solid fa-wifi" style="color:#ef4444;"></i><br><br>Lỗi mạng rùi cậu ơi!`;
                }
            } else {
                try {
                    const saved = localStorage.getItem('mhent_unscram_cmd');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.payload) {
                            processGamePayload(parsed.payload);
                        }
                    }
                } catch(e) {}
            }
        });

        function clearArena() {
            const arena = document.getElementById('arena');
            Array.from(arena.children).forEach(child => {
                if(!child.classList.contains('sentence-counter') && !child.classList.contains('question-banner')) child.remove();
            });
            blocks = [];
            cancelAnimationFrame(animationId);
            isMoving = false;
        }

        function loadSentence(index) {
            clearArena();
            if(!sentenceList || sentenceList.length === 0) return;
            const arena = document.getElementById('arena');
            currentIndex = index;
            document.getElementById('counter').innerText = `Câu ${index + 1} / ${sentenceList.length}`;

            const item = sentenceList[index];
            const sentenceText = typeof item === 'string' ? item : (item.text || '');
            const questionText = item && item.question ? item.question : '';

            updateQuestionDisplay(questionText);

            const words = sentenceText.split(' ').filter(w => w.trim() !== '');
            words.forEach((word, i) => {
                const el = document.createElement('div');
                const randomColorClass = colorClasses[Math.floor(Math.random() * colorClasses.length)];
                el.className = `word-block ${randomColorClass}`;
                el.innerText = word;
                arena.appendChild(el);

                const rect = el.getBoundingClientRect();
                const arenaRect = arena.getBoundingClientRect();
                let x = Math.random() * (arenaRect.width - rect.width - 40) + 20;
                let y = Math.random() * (arenaRect.height - rect.height - 40) + 20;
                let vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);
                let vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);

                blocks.push({ el, x, y, vx, vy, width: rect.width, height: rect.height, order: i });
                el.style.transform = `translate(${arenaRect.width/2 - rect.width/2}px, ${arenaRect.height/2 - rect.height/2}px)`;
            });
        }

        function loadWord(index) {
            clearArena();
            if(!wordList || wordList.length === 0) return;
            const arena = document.getElementById('arena');
            currentIndex = index;
            document.getElementById('counter').innerText = `Từ ${index + 1} / ${wordList.length}`;

            const item = wordList[index];
            const rawText = (typeof item === 'string' ? item : (item.text || "")).trim();
            const questionText = item && item.question ? item.question : '';

            updateQuestionDisplay(questionText);

            if (!rawText) return;

            const subWords = rawText.split(/\s+/).filter(w => w !== "");
            const totalChars = subWords.reduce((sum, w) => sum + Array.from(w).length, 0);
            let sizeClass = '';
            if (totalChars > 14) {
                sizeClass = 'letter-compact';
            } else if (totalChars > 9) {
                sizeClass = 'letter-medium';
            }

            let charOrder = 0;
            subWords.forEach((wordStr, wordIdx) => {
                const chars = Array.from(wordStr);
                chars.forEach((ch, chIdx) => {
                    const el = document.createElement('div');
                    const randomColorClass = colorClasses[Math.floor(Math.random() * colorClasses.length)];
                    el.className = `word-block letter-block ${randomColorClass} ${sizeClass}`.trim();
                    el.innerText = ch;
                    arena.appendChild(el);

                    const rect = el.getBoundingClientRect();
                    const arenaRect = arena.getBoundingClientRect();
                    let x = Math.random() * (arenaRect.width - rect.width - 40) + 20;
                    let y = Math.random() * (arenaRect.height - rect.height - 40) + 20;
                    let vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);
                    let vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);

                    const isLastCharOfWord = (chIdx === chars.length - 1) && (wordIdx < subWords.length - 1);
                    blocks.push({
                        el, x, y, vx, vy,
                        width: rect.width,
                        height: rect.height,
                        order: charOrder,
                        spaceAfter: isLastCharOfWord
                    });
                    charOrder++;
                    el.style.transform = `translate(${arenaRect.width/2 - rect.width/2}px, ${arenaRect.height/2 - rect.height/2}px)`;
                });
            });
        }

        function loadColumns() {
            clearArena();
            const arena = document.getElementById('arena');
            if(!pairList || pairList.length === 0) return;
            document.getElementById('counter').innerText = `Tổng ${pairList.length} cặp`;

            pairList.forEach((pair, index) => {
                ['left', 'right'].forEach((side, sideIndex) => {
                    const el = document.createElement('div');
                    el.className = 'word-block';
                    el.innerText = side === 'left' ? pair.left : pair.right;
                    el.style.background = side === 'left' ? columnColors.left : columnColors.right;
                    el.style.borderColor = '#fff';
                    el.style.color = '#fff';
                    if(side === 'right') el.style.color = '#fff';
                    arena.appendChild(el);

                    const rect = el.getBoundingClientRect();
                    const arenaRect = arena.getBoundingClientRect();
                    let x = Math.random() * (arenaRect.width - rect.width - 40) + 20;
                    let y = Math.random() * (arenaRect.height - rect.height - 40) + 20;
                    let vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);
                    let vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1);

                    blocks.push({ el, x, y, vx, vy, width: rect.width, height: rect.height, order: index * 2 + sideIndex, pairIndex: index, side: side });
                    el.style.transform = `translate(${arenaRect.width/2 - rect.width/2}px, ${arenaRect.height/2 - rect.height/2}px)`;
                });
            });
        }

        function startShuffle() {
            if(blocks.length === 0 || isMoving) return;
            isMoving = true;
            blocks.forEach(b => b.el.style.transition = 'none');
            animate();
        }

        function animate() {
            const arena = document.getElementById('arena');
            const arenaRect = arena.getBoundingClientRect();
            let speedMulti = parseFloat(document.getElementById('speed-slider').value);

            blocks.forEach(b => {
                b.x += b.vx * speedMulti;
                b.y += b.vy * speedMulti;
                if(b.x <= 0 || b.x + b.width >= arenaRect.width) b.vx *= -1;
                if(b.y <= 0 || b.y + b.height >= arenaRect.height) b.vy *= -1;
                b.x = Math.max(0, Math.min(b.x, arenaRect.width - b.width));
                b.y = Math.max(0, Math.min(b.y, arenaRect.height - b.height));
                b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            });

            if(isMoving) { animationId = requestAnimationFrame(animate); }
        }

        function revealAnswer() {
            if(blocks.length === 0) return;
            isMoving = false;
            cancelAnimationFrame(animationId);

            if (currentMode === 'columns') {
                revealPairAnswers();
                return;
            }

            const arenaRect = document.getElementById('arena').getBoundingClientRect();
            const gapX = currentMode === 'word' ? 12 : 20;
            const extraWordGap = currentMode === 'word' ? 24 : 0;
            const gapY = 30;
            const maxWidth = arenaRect.width - 100;

            blocks.sort((a, b) => a.order - b.order);
            let lines = [];
            let currentLine = [];
            let currentLineWidth = 0;

            blocks.forEach(b => {
                const itemSpacing = gapX + (b.spaceAfter ? extraWordGap : 0);
                if (currentLineWidth + b.width > maxWidth && currentLine.length > 0) {
                    const prevLast = currentLine[currentLine.length - 1];
                    const trailing = prevLast.spaceAfter ? (gapX + extraWordGap) : gapX;
                    lines.push({ items: currentLine, width: currentLineWidth - trailing });
                    currentLine = [b];
                    currentLineWidth = b.width + itemSpacing;
                } else {
                    currentLine.push(b);
                    currentLineWidth += b.width + itemSpacing;
                }
            });
            if (currentLine.length > 0) {
                const lastItem = currentLine[currentLine.length - 1];
                const trailing = lastItem.spaceAfter ? (gapX + extraWordGap) : gapX;
                lines.push({ items: currentLine, width: currentLineWidth - trailing });
            }

            const blockHeight = blocks[0].height;
            const totalHeight = (lines.length * blockHeight) + ((lines.length - 1) * gapY);
            
            const banner = document.getElementById('question-banner');
            const hasBanner = banner && banner.style.display !== 'none' && !banner.classList.contains('hidden-hint');
            const minTopPadding = hasBanner ? (banner.offsetTop + banner.offsetHeight + 25) : 40;
            let startY = Math.max(minTopPadding, (arenaRect.height - totalHeight) / 2);

            lines.forEach(line => {
                let currentX = (arenaRect.width - line.width) / 2;
                line.items.forEach(b => {
                    b.el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    b.x = currentX;
                    b.y = startY;
                    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
                    currentX += b.width + gapX + (b.spaceAfter ? extraWordGap : 0);
                });
                startY += blockHeight + gapY;
            });
        }

        function revealPairAnswers() {
            if(pairList.length === 0) return;
            const arena = document.getElementById('arena');
            const arenaRect = arena.getBoundingClientRect();
            const gapY = 24;
            const leftX = 50;
            const rightX = arenaRect.width - 50;

            let startY = 40;
            pairList.forEach((pair, index) => {
                const leftBlock = blocks.find(b => b.pairIndex === index && b.side === 'left');
                const rightBlock = blocks.find(b => b.pairIndex === index && b.side === 'right');
                if (!leftBlock || !rightBlock) return;

                leftBlock.el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                rightBlock.el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';

                leftBlock.x = leftX;
                leftBlock.y = startY;
                leftBlock.el.style.transform = `translate(${leftBlock.x}px, ${leftBlock.y}px)`;

                rightBlock.x = rightX - rightBlock.width;
                rightBlock.y = startY;
                rightBlock.el.style.transform = `translate(${rightBlock.x}px, ${rightBlock.y}px)`;

                startY += Math.max(leftBlock.height, rightBlock.height) + gapY;
            });
        }

        function nextSentence() {
            if (currentMode === 'columns') return;
            if (currentMode === 'word') {
                if(currentIndex < wordList.length - 1) { currentIndex++; loadWord(currentIndex); }
            } else {
                if(currentIndex < sentenceList.length - 1) { currentIndex++; loadSentence(currentIndex); }
            }
        }
        function prevSentence() {
            if (currentMode === 'columns') return;
            if (currentMode === 'word') {
                if(currentIndex > 0) { currentIndex--; loadWord(currentIndex); }
            } else {
                if(currentIndex > 0) { currentIndex--; loadSentence(currentIndex); }
            }
        }

        window.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight') { nextSentence(); }
            else if (e.key === 'ArrowLeft') { prevSentence(); }
            else if (e.key === ' ') { e.preventDefault(); startShuffle(); }
            else if (e.key === 'Enter') { e.preventDefault(); revealAnswer(); }
            else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); toggleHint(); }
        });

    </script>
    <script type="module" src="/js/maintenance.js"></script>
    <script src="/js/aisa-widget.js" defer></script>
</body>
