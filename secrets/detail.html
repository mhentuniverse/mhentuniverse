<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Mã Dữ Liệu | MHEnt Secret</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="security-console" id="detail-box">
        <div id="lock-screen">
            <div class="warning-icon" style="color: #f59e0b;"><i class="fa-solid fa-lock-keyhole"></i></div>
            <div class="glitch-text" id="file-title">HỒ SƠ ĐANG KHÓA</div>
            <p class="system-msg">Vui lòng xác thực bạn là con người để giải mã mật khẩu và link tải.</p>
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div class="g-recaptcha" data-sitekey="6LcI-OMsAAAAAOJyAQa49iw54GuWK28Lih3aifop" data-callback="onCaptchaSuccess" data-theme="dark"></div>
            </div>
            <button class="btn-auth" style="border-color: #64748b; color: #64748b;" onclick="history.back()">Quay lại</button>
        </div>

        <div id="unlock-screen" style="display: none;">
            <div class="warning-icon" style="color: #10b981;"><i class="fa-solid fa-unlock"></i></div>
            <div class="glitch-text" id="unlocked-title">DỮ LIỆU GIẢI MÃ</div>
            
            <div class="system-msg" style="text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; box-sizing: border-box; width: 100%;">
                <div style="margin-bottom: 10px;">📄 Tên: <span id="res-name" style="color: white;"></span></div>
                <div style="margin-bottom: 15px;">🔑 Mật khẩu nén: <br>
                    <code id="res-pass" style="color: #10b981; font-size: 18px; display: block; margin-top: 5px; padding: 5px; background: #000; text-align: center;"></code>
                </div>
                
                <button class="btn-auth" onclick="copyPass()"><i class="fa-solid fa-copy"></i> Sao chép Pass</button>
                
                <button class="btn-auth" id="btn-download" style="background: #10b981; color: black; margin-top: 15px;">
                    <i class="fa-solid fa-download"></i> TẢI XUỐNG NGAY
                </button>
            </div>
            
            <button class="btn-auth" style="border-color: #64748b; color: #64748b; margin-top: 15px;" onclick="window.location.href='/secrets/list.html'">
                <i class="fa-solid fa-list"></i> Về Sảnh Lưu Trữ
            </button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient('https://ctzkgchjheirxwejctvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emtnY2hqaGVpcnh3ZWpjdHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjA0MTgsImV4cCI6MjA5MTgzNjQxOH0.Wl-sBpH1VvcR6-Y4D4UAVm1f5_brGK3cVIHRJBEhOJ0');
        const auth = getAuth(!getApps().length ? initializeApp({ apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", authDomain: "mhentuniverse.firebaseapp.com", projectId: "mhentuniverse" }) : getApp());

        const fileId = new URLSearchParams(window.location.search).get('id');
        onAuthStateChanged(auth, user => { if (!user) window.location.href = '/secrets'; });

        let secretUrl = ""; // Biến giấu kín URL

        window.onCaptchaSuccess = async function() {
            showToast("Hệ thống", "Đang trích xuất dữ liệu tuyệt mật...", "info");
            const { data, error } = await supabase.from('secret_files').select('*').eq('id', fileId).single();
            
            if (error || !data) { showToast("Lỗi", "Hồ sơ không tồn tại!", "error"); return; }

            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('unlock-screen').style.display = 'block';
            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-pass').innerText = data.password;
            
            // Cất Link vào biến JS, không gán ra HTML
            secretUrl = data.download_url; 
            showToast("Thành công", "Giải mã hoàn tất!", "success");
        }

        // Bắn sự kiện onclick cho nút tải
        document.getElementById('btn-download').onclick = () => {
            if(secretUrl) window.open(secretUrl, '_blank');
        };

        window.copyPass = () => {
            const pass = document.getElementById('res-pass').innerText;
            navigator.clipboard.writeText(pass);
            showToast("Hệ thống", "Đã sao chép mật khẩu!", "success");
        }
    </script>
    <script src="/bot-shield.js"></script>
</body>
</html>
