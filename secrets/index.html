<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuyệt Mật | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>

    <div class="security-console" id="auth-box">
        <div class="warning-icon" id="status-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="glitch-text" id="status-title">CẢNH BÁO AN NINH</div>
        <div class="system-msg" id="status-desc">
            KHU VỰC DỮ LIỆU TUYỆT MẬT MHEnt<br><br>
            Hệ thống yêu cầu xác nhận thân phận. Mọi hành vi xâm nhập trái phép đều sẽ bị từ chối truy cập.
        </div>
        
        <button class="btn-auth" id="btn-login" onclick="goToLogin()">
            <i class="fa-solid fa-fingerprint"></i> Xác Thực Danh Tính
        </button>
        
        <div id="loading-msg" style="display: none; color: #10b981; font-weight: bold; margin-top: 20px;">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang trích xuất dữ liệu...
        </div>
    </div>

    <script src="/mhent-ui.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", 
            authDomain: "mhentuniverse.firebaseapp.com", 
            projectId: "mhentuniverse", 
            storageBucket: "mhentuniverse.firebasestorage.app", 
            messagingSenderId: "377044322952", 
            appId: "1:377044322952:web:d657d1b0806d37d9246d3d" 
        };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect');

        // Biến nhớ xem có ai đang đăng nhập ngầm không
        let currentUser = null;
        
        onAuthStateChanged(auth, (user) => {
            currentUser = user; // Chỉ ghi nhớ vào não, KHÔNG tự động mở cổng nữa!
        });

        // KHI BẤM NÚT XÁC THỰC
        window.goToLogin = function() {
            if (redirectTarget) {
                sessionStorage.setItem('mhent_secret_redirect', redirectTarget);
            }
            
            if (currentUser) {
                // ĐÃ ĐĂNG NHẬP: Hiển thị hiệu ứng Quẹt thẻ thành công ngay tại chỗ
                document.getElementById('btn-login').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'block';
                
                document.getElementById('status-icon').innerHTML = '<i class="fa-solid fa-shield-check"></i>';
                document.getElementById('status-icon').style.color = '#10b981';
                document.getElementById('status-title').innerText = "TRUY CẬP HỢP LỆ";
                document.getElementById('status-title').style.color = "#10b981";
                document.getElementById('status-desc').innerHTML = `Đã xác thực Đặc vụ: <b style="color:white;">${currentUser.displayName || 'MHEnt Member'}</b>.<br>Đang thiết lập kết nối an toàn...`;

                showToast("Thành công", `Chào mừng đặc vụ trở lại!`, "success");

                setTimeout(() => {
                    const savedRedirect = sessionStorage.getItem('mhent_secret_redirect');
                    const finalTarget = redirectTarget || savedRedirect;

                    if (finalTarget) {
                        sessionStorage.removeItem('mhent_secret_redirect');
                        window.location.href = '/secrets/detail.html?id=' + finalTarget;
                    } else {
                        window.location.href = '/secrets/list.html';
                    }
                }, 1500); 

            } else {
                // CHƯA ĐĂNG NHẬP: Đá về trạm Login tổng của web
                showToast("Hệ thống", "Đang kết nối đến cổng Đăng nhập...", "info");
                setTimeout(() => {
                    window.location.href = '/login'; 
                }, 1200);
            }
        }
    </script>
    <script src="/bot-shield.js"></script>
</body>
</html>
