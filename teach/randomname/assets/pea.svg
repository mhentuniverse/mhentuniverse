<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <radialGradient id="peaBulletGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#86efac"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <filter id="peaBulletGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Speed motion streaks -->
  <path d="M 5 28 L 22 28" stroke="rgba(74, 222, 128, 0.45)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 2 34 L 18 34" stroke="rgba(74, 222, 128, 0.35)" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Round Pea Bullet -->
  <circle cx="34" cy="30" r="18" fill="url(#peaBulletGrad)" stroke="#166534" stroke-width="2.5" filter="url(#peaBulletGlow)"/>
  <!-- Specular Reflection Highlight -->
  <circle cx="28" cy="24" r="5" fill="#ffffff" opacity="0.85"/>
</svg>
