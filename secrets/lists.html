<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sảnh Lưu Trữ | MHEnt Secret</title>   
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="icon" type="image/jpeg" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/mhent-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .list-container {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .list-header {
            border-bottom: 2px solid #10b981;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .archive-title {
            color: #10b981;
            font-size: 20px;
            font-weight: bold;
        }

        .archive-count {
            color: #94a3b8;
            font-size: 14px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar cho ngầu */
        .file-list::-webkit-scrollbar { width: 5px; }
        .file-list::-webkit-scrollbar-track { background: transparent; }
        .file-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #1e293b;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(30, 41, 59, 0.4);
        }

        .file-item:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
            transform: translateX(5px);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 20px;
            color: #94a3b8;
        }

        .file-item:hover .file-icon { color: #10b981; }

        .file-name {
            font-weight: bold;
            color: #f1f5f9;
        }

        .file-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .status-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag-encrypted { border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <div class="list-container">
        <div class="list-header">
            <div class="archive-title"><i class="fa-solid fa-folder-tree"></i> KHO LƯU TRỮ TRUNG TÂM</div>
            <div class="archive-count" id="item-count">Đang quét dữ liệu...</div>
        </div>

        <div class="file-list" id="file-list">
            </div>

        <div style="margin-top: 20px; text-align: right;">
            <button class="btn-auth" style="width: auto; padding: 8px 20px; font-size: 13px; border-color: #ef4444; color: #ef4444;" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>
        </div>
    </div>

    <script src="/mhent-ui.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDKDAAnmeqWFRqUZWTVa--m5-cORyHCoUk", 
            authDomain: "mhentuniverse.firebaseapp.com", 
            projectId: "mhentuniverse", 
            storageBucket: "mhentuniverse.firebasestorage.app", 
            messagingSenderId: "377044322952", 
            appId: "1:377044322952:web:d657d1b0806d37d9246d3d" 
        };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);

        // 1. DỮ LIỆU TẠM THỜI (Sau này sếp có thể vứt cái mảng này lên Supabase cho xịn)
        const secretFiles = [
            { id: "SDPC_1", name: "MHEnt_SDPC_Tập 1", date: "2024-05-10", type: "video" },
            { id: "SDPC_2", name: "MHEnt_SDPC_Tập 2", date: "2024-05-11", type: "video" },
            { id: "MHEnt_D_01", name: "Tài liệu Thiết kế Dự án X", date: "2024-04-20", type: "document" }
        ];

        // 2. KIỂM TRA ĐĂNG NHẬP (Chặn Luồng 1 nếu chưa quẹt thẻ)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '/secrets'; // Nếu chưa đăng nhập, ở lại trang này để hiển thị nút xác thực
            } else {
                renderList();
            }
        });

        function renderList() {
            const listEl = document.getElementById('file-list');
            document.getElementById('item-count').innerText = `${secretFiles.length} TỆP TIN ĐƯỢC TÌM THẤY`;
            
            listEl.innerHTML = secretFiles.map(file => `
                <div class="file-item" onclick="accessFile('${file.id}')">
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fa-solid ${file.type === 'video' ? 'fa-file-video' : 'fa-file-shield'}"></i>
                        </div>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-date">Ngày lưu: ${file.date} | ID: ${file.id}</div>
                        </div>
                    </div>
                    <div class="status-tag tag-encrypted">Đã mã hóa</div>
                </div>
            `).join('');
        }

        window.accessFile = function(id) {
            showToast("Truy cập", `Đang mở hồ sơ ${id}...`, "info");
            setTimeout(() => {
                window.location.href = `/secrets/detail?id=${id}`;
            }, 800);
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = '/secrets';
            });
        }
    </script>
</body>
</html>
