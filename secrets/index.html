<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Tuyệt Mật | MHEnt. Storage</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-web.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-web.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/secrets/secrets-theme.css">
    <link rel="stylesheet" href="/css/mhent-ui.css">
    <!-- ⚡ BỔ SUNG KHIÊN BẢO VỆ GIAO DIỆN MOBILE -->
    <link rel="stylesheet" href="/css/mhent-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/config.js"></script>
</head>
<body>
    <div class="security-console" id="auth-box">
        <div class="warning-icon" id="status-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="glitch-text" id="status-title">CẢNH BÁO AN NINH</div>
        <div class="system-msg" id="status-desc">
            KHU VỰC LƯU TRỮ TUYỆT MẬT MHEnt<br><br>
            Hệ thống yêu cầu xác nhận danh tính. Mọi hành vi xâm nhập trái phép sẽ bị ghi vết IP và từ chối truy cập.
        </div>
        
        <button class="btn-auth" id="btn-login" onclick="goToLogin()">
            <i class="fa-solid fa-fingerprint"></i> Xác Thực Danh Tính
        </button>
        
        <div id="loading-msg" style="display: none; color: #10b981; font-weight: bold; margin-top: 20px; font-family: 'Nunito', sans-serif;">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang trích xuất mã khóa truy cập...
        </div>
    </div>
    <script src="/js/mhent-ui.js"></script>
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = window.firebaseConfig;
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect');
        let currentUser = null;
        let isRedirecting = false;

        function getActiveUser(firebaseUser) {
            if (firebaseUser) return firebaseUser;
            if (window.getMHEntUser && typeof window.getMHEntUser === 'function') {
                const u = window.getMHEntUser();
                if (u && (u.uid || u.email)) return u;
            }
            try {
                const local = localStorage.getItem('mhent_user_profile');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (parsed && (parsed.uid || parsed.email)) return parsed;
                }
            } catch(e) {}
            return null;
        }

        function handleAuthenticatedUser(user) {
            if (isRedirecting) return;
            isRedirecting = true;
            currentUser = user;

            const btnLogin = document.getElementById('btn-login');
            const loadingMsg = document.getElementById('loading-msg');
            const statusIcon = document.getElementById('status-icon');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');

            if (btnLogin) btnLogin.style.display = 'none';
            if (loadingMsg) loadingMsg.style.display = 'block';

            if (statusIcon) {
                statusIcon.innerHTML = '<i class="fa-solid fa-shield-check"></i>';
                statusIcon.style.color = '#10b981';
            }
            if (statusTitle) {
                statusTitle.innerText = "TRUY CẬP HỢP LỆ";
                statusTitle.style.color = "#10b981";
            }
            const displayName = user.displayName || user.name || (user.email ? user.email.split('@')[0] : 'MHEnt Member');
            if (statusDesc) {
                statusDesc.innerHTML = `Đã xác thực Danh tính: <b style="color:white;">${displayName}</b>.<br>Đang mở kết nối an toàn vào Kho Mật...`;
            }

            if (typeof window.showToast === 'function') {
                window.showToast("Thành công", `Chào mừng ${displayName} trở lại!`, "success");
            }

            setTimeout(() => {
                const savedRedirect = sessionStorage.getItem('mhent_secret_redirect');
                const finalTarget = redirectTarget || savedRedirect;
                if (finalTarget) {
                    sessionStorage.removeItem('mhent_secret_redirect');
                    window.location.href = '/secrets/detail.html?id=' + encodeURIComponent(finalTarget);
                } else {
                    window.location.href = '/secrets/lists.html';
                }
            }, 800);
        }

        // Tự động kiểm tra session tức thì khi vừa nạp trang
        const immediateUser = getActiveUser(auth.currentUser);
        if (immediateUser) {
            handleAuthenticatedUser(immediateUser);
        }

        onAuthStateChanged(auth, (user) => {
            const activeUser = getActiveUser(user);
            if (activeUser) {
                handleAuthenticatedUser(activeUser);
                if (activeUser.uid) {
                    const userRef = doc(db, "users", activeUser.uid);
                    getDoc(userRef).then((uSnap) => {
                        if (uSnap.exists() && uSnap.data().role) {
                            localStorage.setItem('mhent_user_role', uSnap.data().role.toLowerCase());
                        }
                    }).catch(e => console.log("Lỗi nạp cache profile:", e));
                }
            }
        });

        window.goToLogin = function() {
            if (redirectTarget) {
                sessionStorage.setItem('mhent_secret_redirect', redirectTarget);
            }
            
            const activeUser = getActiveUser(currentUser || auth.currentUser);
            if (activeUser) {
                handleAuthenticatedUser(activeUser);
            } else {
                showToast("Hệ thống", "Đang chuyển đến cổng đăng nhập...", "info");
                setTimeout(() => {
                    let returnPath = '/secrets/lists.html'; 
                    if (redirectTarget) {
                        returnPath = '/secrets/detail.html?id=' + encodeURIComponent(redirectTarget); 
                    }
                    window.redirectToLogin(returnPath);
                }, 1000);
            }
        };
    </script>
    <script src="/js/aisa-widget.js" defer></script>
</body>
</html>
